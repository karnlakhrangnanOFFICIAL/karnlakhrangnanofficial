<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Chelsea FC Transfer Deadline Day 2026/27">
  <title>Transfers · KARN LA KHRANg NAN Official</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="assets/images/karnlakhrangnan-logo.png" type="image/png">
  <style>
    .transfer-section {
      margin-bottom: 3rem;
    }
    .transfer-header {
      background: var(--blue-dark);
      color: white;
      padding: 1rem 1.5rem;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      font-family: var(--font-heading);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .transfer-header.out {
      background: #c0392b; /* Red for outs */
    }
    .transfer-header.loan {
      background: #f39c12; /* Yellow for loans */
    }
    .transfer-list {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-top: none;
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      padding: 1rem;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.95rem;
      white-space: nowrap;
    }
    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }
    th {
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }
    tr:last-child td {
      border-bottom: none;
    }
    .player-name {
      font-weight: 700;
      color: var(--text-color);
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--bg-color);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }
    .fee-badge {
      font-family: monospace;
      font-weight: bold;
      color: #27ae60;
    }
    .transfer-header.out + .transfer-list .fee-badge {
      color: #2980b9;
    }
  
    /* TABS */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
    }
    .tab-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 1rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s ease;
      font-family: var(--font-heading);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .tab-btn:hover {
      color: var(--text-color);
    }
    .tab-btn.active {
      color: var(--primary-color);
      border-bottom-color: var(--primary-color);
    }
    .tab-content {
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .tab-content.active {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

  </style>
</head>
<body>
  <!-- ==================== NAVIGATION ==================== -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <img src="assets/images/karnlakhrangnan-logo.png" alt="KARN LA KHRANg NAN Logo">
        <span class="team-name cal-team-name">KARNLAKHRANgNAN</span>
      </a>
      <div class="hamburger" id="hamburger">
        <span></span><span></span><span></span>
      </div>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html" data-i18n="nav.home">หน้าแรก</a></li>
        <li><a href="men-team.html" data-i18n="nav.men_team">ทีมชาย</a></li>
        <li><a href="women-team.html" data-i18n="nav.women_team">ทีมหญิง</a></li>
        <li><a href="trophy.html" data-i18n="nav.trophy">ถ้วยรางวัล</a></li>
        <li><a href="icons.html" data-i18n="nav.icons">i-Cons</a></li>
        <li><a href="the-story-blue.html" data-i18n="nav.story">The Story Blue</a></li>
        <li><a href="about.html" data-i18n="nav.about">About Us</a></li>
        <li><a href="transfers.html" class="active" data-i18n="nav.transfers">Transfers</a></li>
        <li><a href="#" class="lang-toggle" id="langToggle" data-i18n="nav.lang_toggle">EN</a></li>
      </ul>
    </div>
  </nav>

  <!-- ==================== HERO SECTION ==================== -->
  <section class="hero" style="min-height: 250px; padding: 4rem 1rem 2rem;">
    <div class="hero-content">
      <div class="official-badge" style="margin-bottom: 1rem; display: inline-block;">🔄 TRANSFER HUB</div>
      <h1>Chelsea Transfers 2026/27</h1>
      <p class="season">Summer Transfer Window Recap · Final Snapshot</p>
    </div>
  </section>

  <!-- ==================== MAIN CONTENT ==================== -->
  <main class="main-container">
    
    <div class="tabs">
      <button class="tab-btn active" data-tab="men">MEN'S TEAM</button>
      <button class="tab-btn" data-tab="women">WOMEN'S TEAM</button>
    </div>
    
    <div id="tab-men" class="tab-content active">
      <div id="transferContainerMen">
        <div style="text-align: center; padding: 3rem;">
          <p>Loading transfer data...</p>
        </div>
      </div>
    </div>
    
    <div id="tab-women" class="tab-content">
      <div id="transferContainerWomen">
        <div style="text-align: center; padding: 3rem;">
          <p>Loading transfer data...</p>
        </div>
      </div>
    </div>

  </main>

  <script src="assets/js/main.js?v=1"></script>
  <script>
    
    async function loadTransfers() {
      const containerMen = document.getElementById('transferContainerMen');
      const containerWomen = document.getElementById('transferContainerWomen');
      try {
        const res = await fetch('data/transfers_26_27.json');
        if (!res.ok) throw new Error('Failed to load');
        const data = await res.json();
        
        function renderTable(cats, isWomen) {
          let html = '';
          let hasData = false;
          cats.forEach(cat => {
            const categoryData = data.categories[cat.key];
            if (!categoryData || !categoryData.players || categoryData.players.length === 0) return;
            hasData = true;
            let tableRows = '';
            categoryData.players.forEach(p => {
              let detailCol = '';
              if (cat.key.includes('in')) {
                detailCol = `<td>From: <strong>${p.from}</strong></td><td><span class="fee-badge">${p.fee}</span></td>`;
              } else if (cat.key.includes('out')) {
                detailCol = `<td>To: <strong>${p.to || 'Released'}</strong></td><td><span class="fee-badge">${p.fee || ''}</span></td>`;
              } else if (cat.key === 'loan_out') {
                detailCol = `<td>To: <strong>${p.to}</strong></td><td>Term: ${p.loan_term}</td>`;
              }
              tableRows += `
                <tr>
                  <td><span class="player-name">${p.player}</span></td>
                  <td><span class="badge">${p.position || '-'}</span></td>
                  ${detailCol}
                </tr>
              `;
            });
            html += `
              <div class="transfer-section">
                <div class="transfer-header ${cat.class}">
                  <h3>${categoryData.label}</h3>
                  <span style="font-size: 0.9rem; font-weight: normal; background: rgba(255,255,255,0.2); padding: 4px 8px; border-radius: 4px;">${categoryData.players.length} Players</span>
                </div>
                <div class="transfer-list">
                  <table>
                    <tbody>
                      ${tableRows}
                    </tbody>
                  </table>
                </div>
              </div>
            `;
          });
          
          if (!hasData) {
            html = '<div style="text-align: center; padding: 2rem; color: var(--text-muted);">No transfer data available for this category yet.</div>';
          }
          
          return html;
        }
        
        // Render Men
        const menCats = [
          { key: 'in', class: '' },
          { key: 'out_permanent', class: 'out' },
          { key: 'loan_out', class: 'loan' }
        ];
        containerMen.innerHTML = renderTable(menCats, false);
        
        // Render Women
        const womenCats = [
          { key: 'women_in', class: '' },
          { key: 'women_out', class: 'out' }
        ];
        containerWomen.innerHTML = renderTable(womenCats, true);
        
        // Footer sources
        const sourcesHtml = `
          <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 2rem; border-top: 1px solid var(--border-color); padding-top: 1rem; clear: both;">
            <strong>Sources:</strong> ${data.sources.join(', ')}<br>
            Last Updated: ${data.snapshot}
          </div>
        `;
        
        containerMen.innerHTML += sourcesHtml;
        containerWomen.innerHTML += sourcesHtml;
        
      } catch (err) {
        console.error(err);
        containerMen.innerHTML = '<div style="text-align: center; color: red; padding: 2rem;">Error loading transfer data.</div>';
        containerWomen.innerHTML = '<div style="text-align: center; color: red; padding: 2rem;">Error loading transfer data.</div>';
      }
    }

    // Tabs logic
    function setupTabs() {
      const tabBtns = document.querySelectorAll('.tab-btn');
      const tabContents = document.querySelectorAll('.tab-content');
      
      tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          // Remove active class from all
          tabBtns.forEach(b => b.classList.remove('active'));
          tabContents.forEach(c => c.classList.remove('active'));
          
          // Add active class to clicked tab
          btn.classList.add('active');
          const tabId = btn.getAttribute('data-tab');
          document.getElementById('tab-' + tabId).classList.add('active');
        });
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadTransfers();
      setupTabs();
    });

  </script>
</body>
</html>
