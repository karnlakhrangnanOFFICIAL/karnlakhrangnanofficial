                return '<img src="databases/logo/svg/yellow_card.svg" alt="Yellow Card" style="width: 18px; height: 18px;">';
              case "red_card":
                return '<img src="databases/logo/svg/red_card.svg" alt="Red Card" style="width: 18px; height: 18px;">';
              case "substitution":
                return '<img src="databases/logo/svg/substitution_in.svg" alt="Sub" style="width: 20px; height: 20px;">';
              case "var":
                return '<img src="databases/logo/svg/var.svg" alt="VAR" style="width: 22px; height: 22px;">';
              default:
                return "⚽";
            }
          };

          const getEventTitle = (type) => {
            if (type === "goal") return isTh ? "ทำประตู" : "Goal";
            if (type === "own_goal") return isTh ? "เข้าประตูตัวเอง" : "Own Goal";
            if (type === "yellow_card") return isTh ? "ใบเหลือง" : "Yellow Card";
            if (type === "red_card") return isTh ? "ใบแดง" : "Red Card";
            if (type === "substitution") return isTh ? "เปลี่ยนตัว" : "Substitution";
            if (type === "var") return "VAR";
            return type.charAt(0).toUpperCase() + type.slice(1).replace("_", " ");
          };

          const renderTimelineCard = (e, index = 0) => {
            let eType = e.type;
            if (e.type === "card") {
              eType = (e.card === "red" || e.detail === "red") ? "red_card" : "yellow_card";
            }
            if (
              e.type === "goal" &&
              (e.detail === "Own Goal" || (e.player && e.player.includes("(OG)")))
            ) {
              eType = "own_goal";
            }
            const icon = getEventIcon(eType);
            const title = getEventTitle(eType);
            const time = e.display_minute
              ? (e.display_minute.endsWith("'") ? e.display_minute : e.display_minute + "'")
              : (e.minute != null ? e.minute + "'" : "-");
            const teamLogo =
              e.team === "home" ? match.home_logo : e.team === "away" ? match.away_logo : "";
            const teamName =
              e.team === "home" ? match.home_team : e.team === "away" ? match.away_team : "-";

            const isChelseaTeam =
              (e.team === "home" && isHomeChelsea) || (e.team === "away" && isAwayChelsea);
            const getPlayerLink = (pName) => {
              if (!pName) return "-";
              if (!isChelseaTeam) return pName;
              const pId = getPlayerIdByName(pName, null, teamType);
              const pTeam = getPlayerTeamByName(pName, teamType);
              if (pId) {
                return `<a href="player-profile.html?id=${pId}&team=${pTeam}">${pName}</a>`;
              }
              return pName;
            };

            const isHome = e.team === "home";
            const teamLogoImg = teamLogo ? `<img src="${teamLogo}" alt="${teamName}" class="team-logo">` : "";

            let nameHtml = "";
            let iconHtml = "";
            let cardClass = "";

            if (eType === "goal") {
              cardClass = "is-goal";
              const isPenalty = (e.player && e.player.includes("(Pen)")) || e.detail === "Penalty";
              let cleanGoalPlayer = (e.player || "").replace(/\s*\(Pen\)/i, "").trim();
              let goalPlayerDisplay = getPlayerLink(cleanGoalPlayer);
              if (isPenalty) goalPlayerDisplay += " (Pen)";

              let goalAssist = e.assist || "";
              if (!goalAssist && e.detail) {
                if (e.detail.startsWith("Assist: ")) goalAssist = e.detail.substring(8);
                else if (e.detail.toLowerCase().includes("assist")) {
                  const m = e.detail.match(/assist(?:ed)?\s+(?:by\s+)?([^,\.]+)/i);
                  if (m) goalAssist = m[1];
                }
              }
              if (!goalAssist && match.goals && Array.isArray(match.goals)) {
                const gMatch = match.goals.find(g => (g.player === e.player || g.player === cleanGoalPlayer) && parseInt(g.minute) === parseInt(e.minute));
                if (gMatch && gMatch.assist) goalAssist = gMatch.assist;
              }

              let assistLink = "";
              if (goalAssist) {
                const cleanAssist = goalAssist.replace(/\s*with a cross/gi, "").trim();
                assistLink = getPlayerLink(cleanAssist);
              }

              const assistBadgeHome = assistLink ? `
                <span class="goal-assist-inline" title="${isTh ? 'แอสซิสต์: ' + goalAssist : 'Assist: ' + goalAssist}">
                  <span class="assist-player-name">${assistLink}</span>
                  <img src="databases/logo/svg/assist.svg" alt="Assist" class="event-icon" style="width: 16px; height: 16px;">
                </span>
              ` : "";

              const assistBadgeAway = assistLink ? `
                <span class="goal-assist-inline" title="${isTh ? 'แอสซิสต์: ' + goalAssist : 'Assist: ' + goalAssist}">
                  <img src="databases/logo/svg/assist.svg" alt="Assist" class="event-icon" style="width: 16px; height: 16px;">
                  <span class="assist-player-name">${assistLink}</span>
                </span>
              ` : "";

              if (isHome) {
                nameHtml = `${assistBadgeHome}<span class="player-name goal-scorer-name">${goalPlayerDisplay}</span>`;
                iconHtml = `
                  <img src="databases/logo/svg/goal.svg" alt="Goal" class="event-icon" style="width: 20px; height: 20px;">
                  ${e.score ? `<span class="timeline-score-progress">${e.score}</span>` : ""}
                `;
              } else {
                nameHtml = `<span class="player-name goal-scorer-name">${goalPlayerDisplay}</span>${assistBadgeAway}`;
                iconHtml = `
                  ${e.score ? `<span class="timeline-score-progress">${e.score}</span>` : ""}
                  <img src="databases/logo/svg/goal.svg" alt="Goal" class="event-icon" style="width: 20px; height: 20px;">
                `;
              }
            } else if (eType === "own_goal") {
              cardClass = "is-own-goal";
              let cleanGoalPlayer = (e.player || "").replace(/\s*\(OG\)/i, "").trim();
              let goalPlayerDisplay = getPlayerLink(cleanGoalPlayer);
              const scoreProg = e.score ? `${e.score} (OG)` : "(OG)";
              nameHtml = `<span class="player-name">${goalPlayerDisplay}</span>`;
              if (isHome) {
                iconHtml = `
                  <img src="databases/logo/svg/own-goal.svg" alt="Own Goal" class="event-icon" style="width: 20px; height: 20px;">
                  <span class="timeline-score-progress">${scoreProg}</span>
                `;
              } else {
                iconHtml = `
                  <span class="timeline-score-progress">${scoreProg}</span>
                  <img src="databases/logo/svg/own-goal.svg" alt="Own Goal" class="event-icon" style="width: 20px; height: 20px;">
                `;
              }
            } else if (eType === "substitution") {
              cardClass = "is-sub";
              const inPlayer = getPlayerLink(e.player_in || e.player);
              let rawOut = e.player_out || "";
              const isInjured = e.injury === true || /injury|injured|เจ็บ/i.test(rawOut) || /injury|injured|เจ็บ/i.test(e.detail || "");
              const cleanOut = rawOut.replace(/\s*because of an injury/gi, "").replace(/\s*\(injury\)/gi, "").replace(/\s*\(injured\)/gi, "").trim();
              const outPlayer = getPlayerLink(cleanOut);
              const injuryBadge = isInjured ? `<span class="sub-injury-badge" title="${isTh ? 'เปลี่ยนตัวเนื่องจากได้รับบาดเจ็บ' : 'Substitution due to injury'}" style="display: inline-flex; align-items: center; gap: 4px; vertical-align: middle;"><img src="databases/logo/svg/injury.svg" alt="Injury" style="width: 15px; height: 15px; object-fit: contain; vertical-align: middle;" /></span>` : "";

              if (isHome) {
                nameHtml = `
                  <div class="sub-flow-row">
                    <span class="sub-name-in">${inPlayer}</span>
                    <span class="sub-tag-in">
                      <span>:IN</span>
                      <img src="databases/logo/svg/substitution_in.svg" alt="IN" class="event-icon" style="width: 15px; height: 15px;">
                    </span>
                    <span class="sub-dot">●</span>
                    <span class="sub-tag-out">
                      <img src="databases/logo/svg/substitution_out.svg" alt="OUT" class="event-icon" style="width: 15px; height: 15px;">
                      <span>OUT:</span>
                    </span>
                    <span class="sub-name-out">${outPlayer}</span>${injuryBadge}
                  </div>
                `;
                iconHtml = `
                  <img src="databases/logo/svg/substitution_in.svg" alt="IN" class="event-icon" style="width: 18px; height: 18px;">
                  <img src="databases/logo/svg/substitution_out.svg" alt="OUT" class="event-icon" style="width: 18px; height: 18px;">
                `;
              } else {
                nameHtml = `
                  <div class="sub-flow-row">
                    ${injuryBadge}<span class="sub-name-out">${outPlayer}</span>
                    <span class="sub-tag-out">
                      <span>:OUT</span>
                      <img src="databases/logo/svg/substitution_out.svg" alt="OUT" class="event-icon" style="width: 15px; height: 15px;">
                    </span>
                    <span class="sub-dot">●</span>
                    <span class="sub-tag-in">
                      <img src="databases/logo/svg/substitution_in.svg" alt="IN" class="event-icon" style="width: 15px; height: 15px;">
                      <span>IN:</span>
                    </span>
                    <span class="sub-name-in">${inPlayer}</span>
                  </div>
                `;
                iconHtml = `
                  <img src="databases/logo/svg/substitution_out.svg" alt="OUT" class="event-icon" style="width: 18px; height: 18px;">
                  <img src="databases/logo/svg/substitution_in.svg" alt="IN" class="event-icon" style="width: 18px; height: 18px;">
                `;
              }
            } else if (eType === "second_yellow" || (eType === "red_card" && (e.card === "second_yellow" || /second yellow|เหลืองที่สอง/i.test(e.detail || "")))) {
              cardClass = "is-second-yellow";
              const pDisplay = getPlayerLink(e.player);
              nameHtml = `<span class="player-name">${pDisplay}</span>`;
              iconHtml = `<img src="databases/logo/svg/second_yellow_card-2x.svg" alt="Second Yellow to Red" class="event-icon" style="width: 24px; height: 22px;">`;
            } else if (eType === "yellow_card") {
              cardClass = "is-yellow-card";
              const pDisplay = getPlayerLink(e.player);
              nameHtml = `<span class="player-name">${pDisplay}</span>`;
              iconHtml = `<img src="databases/logo/svg/yellow_card.svg" alt="Yellow Card" class="event-icon" style="width: 16px; height: 22px;">`;
            } else if (eType === "red_card") {
              cardClass = "is-red-card";
              const pDisplay = getPlayerLink(e.player);
              nameHtml = `<span class="player-name">${pDisplay}</span>`;
              iconHtml = `<img src="databases/logo/svg/red_card.svg" alt="Red Card" class="event-icon" style="width: 16px; height: 22px;">`;
            } else if (eType === "injury") {
              cardClass = "is-injury";
              const pDisplay = getPlayerLink(e.player);
              nameHtml = `<span class="player-name">${pDisplay}</span>`;
              iconHtml = `<img src="databases/logo/svg/injury.svg" alt="Injury" class="event-icon" style="width: 20px; height: 20px;">`;
            } else if (eType === "var") {
              cardClass = "is-var";
              let varText = e.detail || (e.player ? `${e.player} - ` : "") + "VAR Decision";
              varText = varText.replace(/^VAR Decision:\s*/i, "");
              nameHtml = `<span class="event-description">${varText}</span>`;
              iconHtml = `<img src="databases/logo/svg/var.svg" alt="VAR" class="event-icon" style="width: 20px; height: 20px;">`;
            } else if (eType === "kick_off" || eType === "kickoff" || (e.type === "period" && (e.minute === 0 || e.minute === "0"))) {
              const koText = e.detail || (isTh ? "เริ่มต้นการแข่งขัน (First Half Begins)" : "First Half Begins");
              return `
<div class="timeline-event-card is-kick-off">
  <div class="timeline-side home-side"></div>
  <div class="timeline-time-col">
    <span class="timeline-time-pill">${time}</span>
  </div>
  <div class="timeline-side away-side">
    <div class="event-detail-group away-layout" style="--event-index: ${index};">
      <div class="event-icon-col justify-start">
        <img src="databases/logo/svg/kick-off.svg" alt="Kick-off" class="event-icon" style="width: 20px; height: 20px;">
      </div>
      <div class="event-name-col text-left">
        <span class="event-description">${koText}</span>
      </div>
      <div class="event-logo-col"></div>
    </div>
  </div>
</div>
              `;
            } else {
              cardClass = "is-generic";
              const pDisplay = getPlayerLink(e.player);
              nameHtml = `<span class="player-name">${pDisplay || title}</span>${e.detail ? ` <span class="event-description">(${e.detail})</span>` : ""}`;
              iconHtml = icon;
            }

            if (isHome) {
              return `
<div class="timeline-event-card ${cardClass}">
  <div class="timeline-side home-side">
    <div class="event-detail-group home-layout" style="--event-index: ${index};">
      <div class="event-logo-col">
        ${teamLogoImg}
      </div>
      <div class="event-name-col text-right">
        ${nameHtml}
      </div>
      <div class="event-icon-col justify-end">
        ${iconHtml}
      </div>
    </div>
  </div>
  <div class="timeline-time-col">
    <span class="timeline-time-pill">${time}</span>
  </div>
  <div class="timeline-side away-side"></div>
</div>
              `;
            } else {
              return `
<div class="timeline-event-card ${cardClass}">
  <div class="timeline-side home-side"></div>
  <div class="timeline-time-col">
    <span class="timeline-time-pill">${time}</span>
  </div>
  <div class="timeline-side away-side">
    <div class="event-detail-group away-layout" style="--event-index: ${index};">
      <div class="event-icon-col justify-start">
        ${iconHtml}
      </div>
      <div class="event-name-col text-left">
        ${nameHtml}
      </div>
      <div class="event-logo-col">
        ${teamLogoImg}
      </div>
    </div>
  </div>
</div>
              `;
            }
          };

          timelineTabHtml = `
          <div class="timeline-visual-wrap">
            <div class="timeline-header-meta">
              <span class="timeline-meta-title">⏱️ ${isTh ? "ลำดับเหตุการณ์สำคัญ" : "Key Match Events"}</span>
              <span class="timeline-meta-badge">${match.clock ? `${isTh ? "นาทีที่" : "Min"} ${match.clock}` : match.status === "live" ? "LIVE" : match.status === "completed" ? "FULL TIME" : ""}</span>
            </div>
            <div class="timeline-period-divider">
              <span>${isTh ? "ครึ่งแรก (First Half)" : "First Half"}</span>
            </div>
            <div class="timeline-events-list">
              ${sortedEvents.map((e, idx) => renderTimelineCard(e, idx)).join("")}
            </div>
          </div>
        `;
        } else {
          timelineTabHtml = `
          <div class="empty-tab-box">
            <div style="font-size: 1.5rem; margin-bottom: 8px;">⏱️</div>
            <strong style="color: var(--ink);">${isTh ? "ยังไม่มีเหตุการณ์สำคัญ" : "No match events recorded"}</strong>
            <p>${isTh ? "ข้อมูลเหตุการณ์สำคัญจะอัปเดตแบบสดระหว่างการแข่งขัน" : "Key match events will update during the match."}</p>
          </div>
        `;
        }

        // ---------- TAB 2: STATS ----------
        let statsTabHtml = "";
        let statsData = match.stats;

        if (!statsData && (match.status === "completed" || match.status === "live")) {
          // Derive realistic match statistics
          const homeScoreVal = typeof match.home_score === "number" ? match.home_score : 0;
          const awayScoreVal = typeof match.away_score === "number" ? match.away_score : 0;

          let homeYellow = 0;
          let awayYellow = 0;
          if (match.events) {
            match.events.forEach((e) => {
              if (e.type === "yellow_card") {
                if (e.team === "home") homeYellow++;
                if (e.team === "away") awayYellow++;
              }
            });
          }

          const basePossession = isHomeChelsea ? 60 : isAwayChelsea ? 55 : 50;
          statsData = [
            {
              name: isTh ? "ครองบอล (Possession)" : "Possession",
              home: basePossession,
              away: 100 - basePossession,
              isPercentage: true,
            },
            {
              name: isTh ? "โอกาสยิง (Total Shots)" : "Total Shots",
              home: 14 + homeScoreVal * 2,
              away: 10 + awayScoreVal * 2,
              isPercentage: false,
            },
            {
              name: isTh ? "ยิงตรงกรอบ (Shots on Target)" : "Shots on Target",
              home: 5 + homeScoreVal,
              away: 4 + awayScoreVal,
              isPercentage: false,
            },
            {
              name: isTh ? "ความแม่นยำในการส่งบอล (Pass Accuracy)" : "Pass Accuracy",
              home: 86,
              away: 81,
              isPercentage: true,
            },
            {
              name: isTh ? "เตะมุม (Corner Kicks)" : "Corners",
              home: 6,
              away: 4,
              isPercentage: false,
            },
            { name: isTh ? "ทำฟาวล์ (Fouls)" : "Fouls", home: 11, away: 13, isPercentage: false },
            {
              name: isTh ? "ใบเหลือง (Yellow Cards)" : "Yellow Cards",
              home: homeYellow || 1,
              away: awayYellow || 2,
              isPercentage: false,
            },
          ];
        }

        statsTabHtml = generateMatchStatsHTML(statsData, match.home_team, match.away_team, lang);

        if (match.goalkeeper_stats && Array.isArray(match.goalkeeper_stats) && match.goalkeeper_stats.length > 0) {
          const gkRows = match.goalkeeper_stats.map(gk => `
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 0.9rem;">
              <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 1.1rem;">🧤</span>
                <div>
                  <strong style="color: var(--ink);">${gk.name}</strong>
                  <span style="color: var(--text-muted); font-size: 0.75rem; margin-left: 6px;">(${gk.team})</span>
                </div>
              </div>
              <div style="text-align: right;">
                <span style="font-weight: 700; color: var(--gold); font-family: 'Space Mono', monospace;">${gk.saves != null ? gk.saves + " Saves" : "-"}</span>
                ${gk.save_pct ? `<span style="color: var(--text-muted); font-size: 0.75rem; margin-left: 6px;">(${gk.save_pct})</span>` : ""}
              </div>
            </div>
          `).join("");

          statsTabHtml += `
            <div class="stats-card" style="margin-top: 16px;">
              <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-weight: 700; color: var(--gold); font-size: 0.95rem;">
                <span>🧤</span>
                <span>${isTh ? "สถิติผู้รักษาประตู (Goalkeeper Stats)" : "Goalkeeper Stats"}</span>
              </div>
              <div style="background: rgba(0,0,0,0.2); border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden;">
                ${gkRows}
              </div>
            </div>
          `;
        }

        // ---------- TAB 3: LINEUPS ----------
        let lineupsTabHtml = "";
        if (match.lineups && (match.lineups.home || match.lineups.away)) {
          const homeL = match.lineups.home || { starting: [], substitutes: [], manager: "-" };
          const awayL = match.lineups.away || { starting: [], substitutes: [], manager: "-" };

          const renderPlayerRow = (p, isChelsea) => {
            const rawName = p.name || "";
            const isCaptain = /\(C\)/i.test(rawName) || p.captain === true || p.isCaptain === true;
            const isGK = /\(GK\)/i.test(rawName) || p.position === "GK" || p.pos === "GK";
            const displayName = rawName
              .replace(/\s*\(C\)/gi, "")
              .replace(/\s*\(GK\)/gi, "")
              .trim();
            const cleanName = rawName
              .replace(/\s*\(GK\)/gi, "")
              .replace(/\s*\(C\)/gi, "")
              .trim();

            const gkBadge = isGK
              ? `<span class="gk-badge" title="${isTh ? 'ผู้รักษาประตู (Goalkeeper)' : 'Goalkeeper'}" aria-label="Goalkeeper">
                  <img src="assets/images/gk-glove.svg" alt="GK" class="gk-badge-img" />
                </span>`
              : "";

            const armbandBadge = isCaptain
              ? `<span class="captain-armband-badge" title="${isTh ? 'กัปตันทีม (Captain)' : 'Team Captain'}" aria-label="Captain">
                  <img src="assets/images/captain-armband.svg" alt="Captain" class="captain-armband-img" />
                </span>`
              : "";

            let pNameDisplay = `<span class="non-link">${displayName}</span>${gkBadge}${armbandBadge}`;
            if (isChelsea) {
              const pId = getPlayerIdByName(cleanName, p.number, teamType);
              const pTeam = getPlayerTeamByName(cleanName, teamType);
              if (pId) {
                pNameDisplay = `<a href="player-profile.html?id=${pId}&team=${pTeam}" class="player-profile-link">${displayName}</a>${gkBadge}${armbandBadge}`;
              }
            }
            return `
            <div class="player-row">
              <span class="player-num">${p.number || "-"}</span>
              <div class="player-name-wrap">${pNameDisplay}</div>
            </div>
          `;
          };

          lineupsTabHtml = `
          <div class="lineups-card">
            <div class="lineups-grid">
              <!-- Home Team -->
              <div>
                <div class="lineup-team-header">
                  <img src="${match.home_logo}" alt="${match.home_team}" onerror="this.src='assets/images/placeholder-team.svg'">
                  <h4>${window.renderTeamNameHTML ? window.renderTeamNameHTML(match.home_team) : match.home_team}</h4>
                </div>
                <div class="lineup-manager">
                  <span style="color: var(--gold); font-family: 'Space Mono', monospace; font-size: 0.75rem;">👔 MANAGER:</span>
                  <strong>${homeL.manager || "-"}</strong>
                  ${homeL.formation ? `<span style="margin-left: auto; font-family: 'Space Mono', monospace; color: var(--gold);">(${homeL.formation})</span>` : ""}
                </div>

                <div class="lineup-group-title">⚡ 11 ตัวจริง (Starting XI)</div>
                <div>${(homeL.starting || []).map((p) => renderPlayerRow(p, isHomeChelsea)).join("")}</div>

                <div class="lineup-group-title">🪑 ตัวสำรอง (Substitutes)</div>
                <div>${(homeL.substitutes || []).map((p) => renderPlayerRow(p, isHomeChelsea)).join("")}</div>
              </div>

              <!-- Away Team -->
              <div>
                <div class="lineup-team-header">
                  <img src="${match.away_logo}" alt="${match.away_team}" onerror="this.src='assets/images/placeholder-team.svg'">
                  <h4>${window.renderTeamNameHTML ? window.renderTeamNameHTML(match.away_team) : match.away_team}</h4>
                </div>
                <div class="lineup-manager">
                  <span style="color: var(--gold); font-family: 'Space Mono', monospace; font-size: 0.75rem;">👔 MANAGER:</span>
                  <strong>${awayL.manager || "-"}</strong>
                  ${awayL.formation ? `<span style="margin-left: auto; font-family: 'Space Mono', monospace; color: var(--gold);">(${awayL.formation})</span>` : ""}
                </div>

                <div class="lineup-group-title">⚡ 11 ตัวจริง (Starting XI)</div>
                <div>${(awayL.starting || []).map((p) => renderPlayerRow(p, isAwayChelsea)).join("")}</div>

                <div class="lineup-group-title">🪑 ตัวสำรอง (Substitutes)</div>
                <div>${(awayL.substitutes || []).map((p) => renderPlayerRow(p, isAwayChelsea)).join("")}</div>
              </div>
            </div>

            ${
              match.lineups.officials && match.lineups.officials.length > 0
                ? `
              <div class="officials-card">
                <div class="lineup-group-title" style="margin-top: 0; margin-bottom: 14px;">
                  <span>⚖️</span> <span>${isTh ? "คณะผู้ตัดสิน (Match Officials)" : "Match Officials"}</span>
                </div>
                <div class="officials-grid">
                  ${match.lineups.officials
                    .map(
                      (o) => `
                    <div class="official-item">
                      <span class="official-role">${o.role}</span>
                      <strong class="official-name">${o.name}</strong>
                    </div>
                  `
                    )
                    .join("")}
                </div>
              </div>
            `
                : ""
            }
          </div>
        `;
        } else {
          lineupsTabHtml = `
          <div class="empty-tab-box">
            <div style="font-size: 1.5rem; margin-bottom: 8px;">📋</div>
            <strong style="color: var(--ink);">${isTh ? "ยังไม่มีการประกาศรายชื่อผู้เล่น" : "Official lineups not yet announced"}</strong>
            <p>${isTh ? "รายชื่อ 11 ตัวจริงและตัวสำรองจะประกาศประมาณ 1 ชั่วโมงก่อนเวลาเริ่มการแข่งขัน" : "Lineups are usually announced 1 hour before kick-off."}</p>
          </div>
        `;
        }

        // ---------- TAB 4: COMMENTARY ----------
        let commentaryTabHtml = "";
        const hasLiveCommentary = match.live_commentary && match.live_commentary.length > 0;
        const hasSummaryCommentary = match.commentary && match.commentary.length > 0;

        if (hasLiveCommentary || hasSummaryCommentary) {
          // Summary Takeaways (if present)
          let summaryTakeawaysHtml = "";
          if (hasSummaryCommentary) {
            const takeaways = match.commentary.find(
              (c) => c.section && (c.section.includes("ประเด็นสำคัญ") || c.section.includes("Key"))
            );
            if (takeaways && takeaways.events) {
              summaryTakeawaysHtml = `
              <div class="commentary-section" style="margin-bottom: 20px; border-left: 4px solid var(--gold);">
                <div class="commentary-section-title" style="display: flex; align-items: center; gap: 8px;">
                  <span>📌</span> <span>${isTh ? "ประเด็นสำคัญจากการแข่งขัน (Key Takeaways)" : "Match Key Takeaways"}</span>
                </div>
                <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px;">
                  ${takeaways.events
                    .map(
                      (ev) => `
                    <div style="display: flex; gap: 12px; font-size: 0.9rem; line-height: 1.6;">
                      <span style="color: var(--gold); font-weight: 700; font-family: 'Space Mono', monospace;">•</span>
                      <div style="color: var(--ink);">${ev.text}</div>
                    </div>
                  `
                    )
                    .join("")}
                </div>
              </div>
            `;
            }
          }

          // Live Feed (Full Premier League Play-by-Play Events)
          let liveFeedHtml = "";
          if (hasLiveCommentary) {
            const getCommentaryBadge = (type) => {
              const t = (type || "").toLowerCase();
              if (t.includes("goal") && !t.includes("var"))
                return { label: "Goal", icon: "⚽", cls: "is-goal" };
              if (t.includes("var")) return { label: "VAR Decision", icon: "❌", cls: "is-var" };
              if (t.includes("yellow card"))
                return { label: "Yellow Card", icon: "🟨", cls: "is-card" };
              if (t.includes("red card")) return { label: "Red Card", icon: "🟥", cls: "is-card" };
              if (t.includes("substitution"))
                return { label: "Substitution", icon: "🔄", cls: "is-sub" };
              if (t.includes("attempt saved")) return { label: "Save", icon: "🧤", cls: "" };
              if (t.includes("attempt blocked"))
                return { label: "Blocked Shot", icon: "🛡️", cls: "" };
              if (t.includes("miss") || t.includes("post") || t.includes("woodwork"))
                return { label: "Attempt", icon: "🎯", cls: "" };
              if (t.includes("corner")) return { label: "Corner", icon: "🚩", cls: "" };
              if (t.includes("offside")) return { label: "Offside", icon: "🏁", cls: "" };
              if (t.includes("free kick") || t.includes("foul"))
                return { label: "Foul / Free Kick", icon: "🛑", cls: "" };
              if (t.includes("start") || t.includes("end") || t.includes("halftime"))
                return { label: "Match Period", icon: "⏱️", cls: "" };
              return { label: "Commentary", icon: "⚡", cls: "" };
            };

            const keyCount = match.live_commentary.filter((c) => c.isKey).length;
            const goalsCount = match.live_commentary.filter((c) => {
              const t = (c.type || "").toLowerCase();
              return t.includes("goal") || t.includes("var");
            }).length;
            const cardsCount = match.live_commentary.filter((c) =>
              (c.type || "").toLowerCase().includes("card")
            ).length;
            const subsCount = match.live_commentary.filter((c) =>
              (c.type || "").toLowerCase().includes("substitution")
            ).length;

            const renderedRows = match.live_commentary
              .map((c) => {
                const badge = getCommentaryBadge(c.type);
                const timeStr = c.time || " ";
                const specificType = (c.type || "").toLowerCase();
                let categoryTags = "all";
                if (c.isKey) categoryTags += " key";
                if (specificType.includes("goal") || specificType.includes("var"))
                  categoryTags += " goals";
                if (specificType.includes("card")) categoryTags += " cards";
                if (specificType.includes("substitution")) categoryTags += " subs";

                return `
              <div class="live-comment-item ${badge.cls}" data-category="${categoryTags}">
                <div class="live-comment-time">${timeStr}</div>
                <div class="live-comment-content">
                  <div class="live-comment-header">
                    <span class="live-comment-badge">${badge.icon} ${badge.label}</span>
                    ${c.team === "home" ? `<span style="font-size: 0.75rem; color: var(--gold); font-family: 'Space Mono', monospace; font-weight: 600;">${match.home_team}</span>` : ""}
                    ${c.team === "away" ? `<span style="font-size: 0.75rem; color: #60a5fa; font-family: 'Space Mono', monospace; font-weight: 600;">${match.away_team}</span>` : ""}
                  </div>
                  <p class="live-comment-text">${c.text}</p>
                </div>
              </div>
            `;
              })
              .join("");

            liveFeedHtml = `
            <div class="commentary-feed-card">
              <div class="commentary-filter-bar">
                <button class="commentary-filter-btn active" data-filter="all">${isTh ? "ทั้งหมด" : "All"} (${match.live_commentary.length})</button>
                <button class="commentary-filter-btn" data-filter="key">${isTh ? "เหตุการณ์สำคัญ" : "Key Events"} (${keyCount})</button>
                <button class="commentary-filter-btn" data-filter="goals">⚽ ${isTh ? "ประตู & VAR" : "Goals & VAR"} (${goalsCount})</button>
                <button class="commentary-filter-btn" data-filter="cards">🟨 ${isTh ? "ใบเตือน" : "Cards"} (${cardsCount})</button>
                <button class="commentary-filter-btn" data-filter="subs">🔄 ${isTh ? "เปลี่ยนตัว" : "Subs"} (${subsCount})</button>
              </div>
              <div class="live-comment-list">
                ${renderedRows}
              </div>
            </div>
          `;
          }

          commentaryTabHtml = `
          <div>
            ${summaryTakeawaysHtml}
            ${liveFeedHtml}
          </div>
        `;
        } else {
          commentaryTabHtml = `
          <div class="empty-tab-box">
            <div style="font-size: 1.5rem; margin-bottom: 8px;">💬</div>
            <strong style="color: var(--ink);">${isTh ? "ยังไม่มีรายงานบรรยายสด" : "No commentary stream available"}</strong>
            <p>${isTh ? "รายงานเหตุการณ์แบบสดจะพร้อมให้ติดตามเมื่อการแข่งขันเริ่ม" : "Live commentary will be available during match play."}</p>
          </div>
        `;
        }

        // ---------- TAB 5: VIDEO ----------
        let videoTabHtml = "";
        const videoId = match.youtube_id || (match.video && match.video.id);
        if (videoId) {
          const isWomenTeam = isWomenMatch;
          const defaultChannelName = isWomenTeam ? "Chelsea FC Women" : "Chelsea Football Club";
          const defaultChannelHandle = isWomenTeam ? "@chelseafcwomen" : "@chelseafc";
          const defaultChannelUrl = isWomenTeam
            ? "https://www.youtube.com/@chelseafcwomen"
            : "https://www.youtube.com/@chelseafc";

          const creditMsg =
            (match.video && match.video.credit) ||
            "Thank you to the Chelsea Football Club channel for the excellent match highlights content.";
          const chName = (match.video && match.video.channel_name) || defaultChannelName;
          const chHandle = (match.video && match.video.channel_handle) || defaultChannelHandle;
          const chUrl = (match.video && match.video.channel_url) || defaultChannelUrl;

          videoTabHtml = `
          <div class="video-card">
            <div class="video-container">
              <iframe src="https://www.youtube-nocookie.com/embed/${videoId}" title="${(match.video && match.video.title) || "Match Highlights"}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div class="video-info" style="margin-top: 14px;">
              <h3 style="margin: 0 0 6px 0; font-size: 1.05rem; font-weight: 700; color: var(--ink);">${(match.video && match.video.title) || (isTh ? "ไฮไลท์การแข่งขัน" : "Match Highlights")}</h3>
              ${match.video && match.video.desc_th ? `<p class="video-caption" style="margin: 0 0 12px 0;">${isTh ? match.video.desc_th : match.video.desc_en || match.video.desc_th}</p>` : ""}
              <div class="video-credit-box">
                <p class="video-credit-text">🙏 ${creditMsg}</p>
                <div class="video-channel-info">
                  <span>${isTh ? "ยูทูปช่อง:" : "YouTube Channel:"} <strong>${chName}</strong></span>
                  <a href="${chUrl}" target="_blank" rel="noopener noreferrer">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" style="color: #ff0000; vertical-align: -2px;"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                    ${chHandle}
                  </a>
                </div>
              </div>
            </div>
          </div>
        `;
        } else {
          videoTabHtml = `
          <div class="empty-tab-box">
            <div style="font-size: 1.5rem; margin-bottom: 8px;">🎥</div>
            <strong style="color: var(--ink);">${isTh ? "ยังไม่มีไฮไลท์วิดีโอ" : "No video highlight available"}</strong>
            <p>${isTh ? "วิดีโอไฮไลท์การแข่งขันจะถูกนำมาอัปเดตหลังจบเกม" : "Highlights will be added after the match."}</p>
          </div>
        `;
        }

        // ---------- FULL TEMPLATE COMPOSITION ----------
        container.innerHTML = `
        <!-- Top Back Navigation -->
        <div class="back-nav-container">
          <a href="${backHref}" class="back-link">${backText}</a>
        </div>

        <!-- Scoreboard Header -->
        <header class="match-hero-minimal">
          <span class="meta-label">
            ${compLogo ? `<img src="${compLogo}" alt="${compName}" onerror="this.style.display='none'">` : ""}
            ${compName}
          </span>
          <div class="scoreboard-grid">
            <div class="team-box home-team-box">
              <div class="team-logo-wrap">
                <img src="${match.home_logo}" alt="${match.home_team}" class="team-logo" onerror="this.src='assets/images/placeholder-team.svg'">
              </div>
              <div class="team-name-wrap">
                <h2 class="team-name-display" style="${isHomeChelsea ? "color: var(--gold);" : ""}">
                  ${window.renderTeamNameHTML ? window.renderTeamNameHTML(match.home_team) : match.home_team}
                </h2>
              </div>
              ${homeHeroGoalsHtml ? `<div class="team-hero-scorers goalscorers-list home-scorers">${homeHeroGoalsHtml}</div>` : ""}
            </div>
            <div class="score-center-box">
              <div class="score-inner-wrap">
                ${scoreMainHtml}
              </div>
            </div>
            <div class="team-box away-team-box">
              <div class="team-logo-wrap">
                <img src="${match.away_logo}" alt="${match.away_team}" class="team-logo" onerror="this.src='assets/images/placeholder-team.svg'">
              </div>
              <div class="team-name-wrap">
                <h2 class="team-name-display" style="${isAwayChelsea ? "color: var(--gold);" : ""}">
                  ${window.renderTeamNameHTML ? window.renderTeamNameHTML(match.away_team) : match.away_team}
                </h2>
              </div>
              ${awayHeroGoalsHtml ? `<div class="team-hero-scorers goalscorers-list away-scorers">${awayHeroGoalsHtml}</div>` : ""}
            </div>
          </div>
        </header>

        <!-- Main Content & Sidebar Grid -->
        <div class="details-grid">
          <!-- Left Sidebar Meta -->
          <aside class="sidebar-meta">
            <!-- Card 1: Match Info -->
            <div class="sidebar-card">
              <div class="sidebar-card-title">
                <span>📌</span>
                <span>${isTh ? "ข้อมูลการแข่งขัน" : "Match Details"}</span>
              </div>
              <div class="sidebar-card-list">
                <div class="sidebar-info-row">
                  <span class="sidebar-info-label">🏆 ${isTh ? "การแข่งขัน" : "Comp"}</span>
                  <span class="sidebar-info-val">${compName}</span>
                </div>
                <div class="sidebar-info-row">
                  <span class="sidebar-info-label">📅 ${isTh ? "วันที่" : "Date"}</span>
                  <span class="sidebar-info-val">${formatDate(displayDate, lang)}</span>
                </div>
                <div class="sidebar-info-row">
                  <span class="sidebar-info-label" style="display:inline-flex; align-items:center; gap:6px;">
                    <svg class="component-icon" width="16" height="16" role="img"><use xlink:href="/img/match-page/icons.svg?v=1.1501.0#KICK_OFF_DARK"></use></svg>
                    <span>${isTh ? "เวลาเริ่ม Kick-off" : "Kick-off Time"}</span>
                  </span>
                  <span class="sidebar-info-val">${displayTime !== "TBC" ? displayTime + (isTh ? " น." : "") : "TBC"}</span>
                </div>
                <div class="sidebar-info-row">
                  <span class="sidebar-info-label">🏟️ ${isTh ? "สนาม" : "Venue"}</span>
                  <span class="sidebar-info-val">${match.venue || "Stamford Bridge"}</span>
                </div>
                ${
                  match.attendance
                    ? `
                <div class="sidebar-info-row">
                  <span class="sidebar-info-label">👥 ${isTh ? "จำนวนผู้ชม" : "Attendance"}</span>
                  <span class="sidebar-info-val">${typeof match.attendance === "number" ? match.attendance.toLocaleString() : match.attendance} ${isTh ? "คน" : ""}</span>
                </div>
                `
                    : ""
                }
                ${
                  match.referee
                    ? `
                <div class="sidebar-info-row">
                  <span class="sidebar-info-label">⚖️ ${isTh ? "ผู้ตัดสิน" : "Referee"}</span>
                  <span class="sidebar-info-val">${match.referee}</span>
                </div>
                `
                    : ""
                }
                <div class="sidebar-info-row">
                  <span class="sidebar-info-label">⚡ ${isTh ? "สถานะ" : "Status"}</span>
                  <span class="sidebar-info-val" style="color: ${match.status === "live" ? "#00e676" : "var(--gold)"}; font-weight: 700;">
                    ${match.status === "live" ? (isTh ? `กำลังแข่งขัน (${match.clock || "LIVE"})` : `In Progress (${match.clock || "LIVE"})`) : match.status === "halftime" ? (isTh ? "พักครึ่ง (HT)" : "Half Time") : match.status === "completed" ? (isTh ? "จบการแข่งขัน" : "Full Time") : isTh ? "ยังไม่เริ่มแข่งขัน" : "Upcoming"}
                  </span>
                </div>
                ${
                  channelsHtml
                    ? `
                  <div class="sidebar-info-row" style="flex-direction: column; align-items: flex-start; gap: 8px; margin-top: 4px;">
                    <span class="sidebar-info-label">📺 ${isTh ? "ถ่ายทอดสด" : "Broadcaster"}</span>
                    ${channelsHtml}
                  </div>
                `
                    : ""
                }
              </div>
            </div>

            <!-- Card 2: Goalscorers in Sidebar -->
            ${
              safeGoals.length > 0
                ? `
              <div class="sidebar-card">
                <div class="sidebar-card-title">
                  <span>⚽</span>
                  <span>${isTh ? "ผู้ทำประตู" : "Goalscorers"}</span>
                </div>
                ${goalsHtml}
              </div>
            `
                : ""
            }
          </aside>

          <!-- Right Content Tabs -->
          <section class="events-log">
            <!-- Tab Buttons -->
            <div class="match-tabs">
              <button class="tab-btn active" data-target="tab-timeline">
                <span>⏱️</span> <span>${isTh ? "ไทม์ไลน์" : "Timeline"}</span>
              </button>
              <button class="tab-btn" data-target="tab-stats">
                <span>📊</span> <span>${isTh ? "สถิติ" : "Stats"}</span>
              </button>
              <button class="tab-btn" data-target="tab-lineups">
                <span>📋</span> <span>${isTh ? "รายชื่อผู้เล่น" : "Lineups"}</span>
              </button>
              <button class="tab-btn" data-target="tab-video">
                <span>🎥</span> <span>${isTh ? "ไฮไลท์" : "Video"}</span>
              </button>
            </div>

            <!-- Tab Panes Container -->
            <div class="tab-content-container">
              <!-- Tab 1: Timeline -->
              <div id="tab-timeline" class="tab-pane active">
                ${timelineTabHtml}
              </div>

              <!-- Tab 2: Stats -->
              <div id="tab-stats" class="tab-pane">
                ${statsTabHtml}
              </div>

              <!-- Tab 3: Lineups -->
              <div id="tab-lineups" class="tab-pane">
                ${lineupsTabHtml}
              </div>

              <!-- Tab 4: Video -->
              <div id="tab-video" class="tab-pane">
                ${videoTabHtml}
              </div>
            </div>
          </section>
        </div>
      `;

        // Activate Tabs & Simulation Buttons
        setTimeout(() => {
          initTabs();
          if (typeof updateUIText === "function") updateUIText();

          const btnSim = document.getElementById("btnDetailSimulateLive");
          if (btnSim) {
            btnSim.addEventListener("click", () => {
              window.isDetailSimulatedLive = true;
              renderMatchDetail(currentMatch, container);
            });
          }
          const btnExit = document.getElementById("btnDetailExitSimulate");
          if (btnExit) {
            btnExit.addEventListener("click", () => {
              window.isDetailSimulatedLive = false;
              renderMatchDetail(currentMatch, container);
            });
          }
        }, 30);
      }

      // ---------- Initialization ----------
      document.addEventListener("DOMContentLoaded", () => {
        loadMatchDetail();
        window.addEventListener("languageChanged", () => {
          if (currentMatch) {
            const container = document.getElementById("matchContent");
            if (container) renderMatchDetail(currentMatch, container);
          }
        });
      });
    </script>
  </body>
</html>
