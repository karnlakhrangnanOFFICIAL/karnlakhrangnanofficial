<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Match Detail · KARN LA KHRANg NAN Official</title>
    <link rel="stylesheet" href="assets/css/style.css?v=1788043038" />
    <link rel="icon" href="assets/images/karnlakhrangnan-logo.png" type="image/png" />
    <script>
      (function () {
        var t =
          localStorage.getItem("theme") || localStorage.getItem("chelsea_theme") || "classic-blue";
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.classList.add("theme-" + t);
      })();
    </script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap");

      :root,
      [data-theme="modern-dark"],
      .theme-modern-dark {
        --bg: #0c0c0e;
        --card-bg: rgba(255, 255, 255, 0.03);
        --ink: #ffffff;
        --accent: #0033a0;
        --accent-light: #1a56db;
        --ink-faint: rgba(255, 255, 255, 0.08);
        --ink-muted: rgba(255, 255, 255, 0.55);
        --gold: #d4af37;
        --gold-light: #f3e5ab;
        --danger: #ef4444;
        --success: #10b981;
      }

      [data-theme="classic-blue"],
      .theme-classic-blue {
        --bg: #f4f6fa;
        --card-bg: #ffffff;
        --ink: #001489;
        --accent: #001489;
        --accent-light: #034694;
        --ink-faint: rgba(0, 20, 137, 0.1);
        --ink-muted: #536471;
        --gold: #d4af37;
        --gold-light: #856404;
        --danger: #ef4444;
        --success: #10b981;
      }

      body {
        background-color: var(--bg);
        color: var(--ink);
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* Back Link */
      .back-nav-container {
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .back-link {
        font-family: "Space Mono", monospace;
        text-transform: uppercase;
        font-size: 0.8rem;
        color: var(--gold);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition:
          transform 0.2s ease,
          color 0.2s ease;
      }
      .back-link:hover {
        color: var(--gold-light);
        transform: translateX(-4px);
      }

      /* Scoreboard Hero */
      .match-hero-minimal {
        text-align: center;
        border-bottom: 1px solid var(--ink-faint);
        padding-bottom: 36px;
        margin-bottom: 36px;
        margin-top: 10px;
      }
      .meta-label {
        font-family: "Space Mono", monospace;
        font-size: 1.1rem;
        line-height: 1.4;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: var(--gold);
        margin-bottom: 20px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      .meta-label img {
        width: 26px;
        height: 26px;
        object-fit: contain;
      }

      /* ============================================
         Scoreboard Grid Layout (เลย์เอาต์หลัก 3 คอลัมน์)
         ============================================ */
      .scoreboard-grid {
        display: grid;
        /* แบ่ง 3 คอลัมน์: 1fr (เจ้าบ้าน) | auto (สกอร์ตรงกลาง) | 1fr (ทีมเยือน) */
        grid-template-columns: 1fr auto 1fr;
        gap: 20px;
        align-items: start; /* บังคับให้เนื้อหาเริ่มจากด้านบนตรงกัน */
        width: 100%;
        padding: 24px;
        background-color: #caccfc;
        border-radius: 16px;
        border: 1px solid rgba(0, 0, 0, 0.1);
        color: #03132e;
      }

      .scoreboard-grid .team-name-display {
        color: #03132e;
      }

      /* ============================================
         กล่องทีมซ้าย-ขวา (คอลัมน์ 1 และ 3)
         ============================================ */
      .team-box {
        display: flex;
        flex-direction: column; /* บังคับให้ โลโก้ -> ชื่อทีม -> คนยิง เรียงจากบนลงล่าง */
        gap: 12px; /* ระยะห่างระหว่างบรรทัด 1, 2, และ 3 */
      }

      /* ให้เนื้อหาในกล่องทีมอยู่กึ่งกลางของฝั่งตัวเอง */
      .home-team-box,
      .away-team-box {
        align-items: center; 
      }

      /* --- บรรทัดที่ 1: โลโก้ และ สกอร์ --- */
      .team-logo-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 72px; /* ล็อกความสูงไว้ เพื่อให้โลโก้ 2 ฝั่งตรงกับกล่องสกอร์ตรงกลางพอดี */
      }

      .team-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2)); /* เพิ่มเงาให้โลโก้ดูโดดเด่น */
        transition: transform 0.3s ease;
      }

      .team-logo:hover {
        transform: scale(1.05);
      }

      .score-center-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 72px; /* ความสูงเท่ากับโลโก้ ทำให้สกอร์อยู่บรรทัดเดียวกันเป๊ะ */
      }

      .score-main {
        font-size: 2.2rem;
        font-weight: 800;
        font-family: var(--font-mono, "Space Mono", monospace);
        color: #03132e;
        background-color: #ffffff;
        padding: 4px 20px;
        border-radius: 10px;
        border: 1px solid rgba(0, 0, 0, 0.12);
        letter-spacing: 2px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        line-height: 1.2;
      }

      .score-main.upcoming-kickoff-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 8px 18px;
        letter-spacing: 0.5px;
        gap: 3px;
        min-width: 140px;
        background-color: #ffffff;
      }

      .kickoff-label-tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        color: #0033a0;
        letter-spacing: 0.8px;
        font-family: var(--font-mono, "Space Mono", monospace);
        line-height: 1;
      }

      .kickoff-label-tag .component-icon,
      .component-icon {
        display: inline-block;
        vertical-align: middle;
        width: 18px;
        height: 18px;
        fill: currentColor;
        flex-shrink: 0;
      }

      .kickoff-time-text {
        font-size: 1.65rem;
        font-weight: 800;
        color: #03132e;
        font-family: var(--font-mono, "Space Mono", monospace);
        line-height: 1.2;
      }

      #liveBadgeWrap {
        margin-top: 8px; /* ระยะห่างของป้าย Live ใต้สกอร์ */
      }

      /* --- บรรทัดที่ 2: ชื่อทีม --- */
      .team-name-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 28px; /* เผื่อชื่อทีมยาวจนต้องขึ้นบรรทัดใหม่ โครงสร้างจะได้ไม่เบี้ยว */
      }

      .team-name-display {
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--ink);
        margin: 0;
        text-align: center;
      }

      html[data-theme="editorial"] .score-main,
      html[data-theme="editorial"] #scoreMain,
      html[data-theme="editorial"] .team-name-display,
      html[data-theme="editorial"] .team-name-display span,
      html[data-theme="editorial"] .timeline-player-name,
      html[data-theme="editorial"] .timeline-player-name span,
      html[data-theme="editorial"] .timeline-event-detail,
      html[data-theme="editorial"] .timeline-event-card,
      html[data-theme="editorial"] .stats-header-team span,
      html[data-theme="editorial"] .stats-header-team span span,
      html[data-theme="editorial"] .stat-value-home,
      html[data-theme="editorial"] .stat-value-away,
      html[data-theme="editorial"] .stat-name {
        color: #000000 !important;
      }

      html[data-theme="editorial"] .score-main {
        background: rgba(0, 0, 0, 0.05) !important;
        border-color: rgba(0, 0, 0, 0.12) !important;
      }

      /* ============================================
         สไตล์รายชื่อผู้ทำประตู (ล็อกคอลัมน์เป๊ะแบบตาราง)
         ============================================ */
      .goalscorers-list {
        display: flex;
        flex-direction: column;
        gap: 4px; /* ระยะห่างระหว่างบรรทัด (ปรับลดลงให้ดูแน่นเหมือนตาราง) */
        margin-top: 16px;
        width: 100%;
      }

      /* ---------------------------------------------------
         ทีมเหย้า (ซ้าย) 
         ตีกรอบ 3 คอลัมน์: นาที(45px) | ชื่อ(1fr) | รูป(25px)
      --------------------------------------------------- */
      .home-scorers .goal-item {
        display: grid;
        grid-template-columns: 45px 1fr 25px; 
        align-items: center;
        width: 100%;
      }

      .home-scorers .goal-minute {
        text-align: left; /* นาทีชิดซ้ายสุดขอบตาราง */
      }

      .home-scorers .goal-player {
        text-align: right; /* ชื่อชิดขวาไปหาลูกบอล */
        padding-right: 12px; /* เว้นระยะห่างระหว่างชื่อกับลูกบอล */
      }

      .home-scorers .goal-icon-wrap {
        display: flex;
        justify-content: flex-end; /* ลูกบอลชิดขวาสุดริมตารางกลาง */
      }

      /* ---------------------------------------------------
         ทีมเยือน (ขวา)
         ตีกรอบ 3 คอลัมน์: รูป(25px) | ชื่อ(1fr) | นาที(45px)
      --------------------------------------------------- */
      .away-scorers .goal-item {
        display: grid;
        grid-template-columns: 25px 1fr 45px;
        align-items: center;
        width: 100%;
      }

      .away-scorers .goal-icon-wrap {
        display: flex;
        justify-content: flex-start; /* ลูกบอลชิดซ้ายสุดริมตารางกลาง */
      }

      .away-scorers .goal-player {
        text-align: left; /* ชื่อชิดซ้ายไปหาลูกบอล */
        padding-left: 12px; /* เว้นระยะห่างระหว่างลูกบอลกับชื่อ */
      }

      .away-scorers .goal-minute {
        text-align: right; /* นาทีชิดขวาสุดขอบตาราง */
      }

      /* ---------------------------------------------------
         สไตล์ทั่วไป (ตัวอักษร ตัดคำ รูปภาพ)
      --------------------------------------------------- */
      .goal-player {
        font-weight: 600;
        color: var(--ink, #ffffff);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      html[data-theme="editorial"] .goal-player {
        color: #000000 !important;
      }

      .goal-minute {
        font-family: var(--font-mono, "Space Mono", monospace);
        font-weight: 700;
        color: #38bdf8;
        font-size: 0.85rem;
      }

      .goal-icon {
        width: 14px;
        height: 14px;
        object-fit: contain;
        display: block;
      }

      /* Global Tooltip: White text with black outline */
      .global-tooltip {
        position: absolute;
        background: rgba(10, 22, 44, 0.97);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: #ffffff !important;
        text-shadow: 
          -1px -1px 0 #000000,
           1px -1px 0 #000000,
          -1px  1px 0 #000000,
           1px  1px 0 #000000,
           0px  1px 3px rgba(0, 0, 0, 0.9);
        -webkit-text-stroke: 0.35px #000000;
        padding: 8px 12px;
        border-radius: 10px;
        font-size: 0.85rem;
        font-weight: 600;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.15s ease, transform 0.15s ease;
        z-index: 99999;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65), 0 0 16px rgba(56, 189, 248, 0.25);
        border: 1px solid rgba(56, 189, 248, 0.35);
        max-width: 330px;
        font-family: "Space Grotesk", "Anakotmai", sans-serif;
        text-align: left;
      }
      .global-tooltip *,
      .global-tooltip span,
      .global-tooltip p,
      .global-tooltip strong {
        color: #ffffff !important;
        text-shadow: 
          -1px -1px 0 #000000,
           1px -1px 0 #000000,
          -1px  1px 0 #000000,
           1px  1px 0 #000000,
           0px  1px 3px rgba(0, 0, 0, 0.9) !important;
      }
      .global-tooltip.show {
        opacity: 1;
      }
      .match-status {
        font-family: "Space Mono", monospace;
        font-size: 0.75rem;
        background: var(--ink);
        color: var(--bg);
        padding: 5px 14px;
        margin-top: 14px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 0.08em;
        border-radius: 4px;
      }
      .match-status.live {
        background: #d32f2f;
        color: #ffffff;
        animation: pulseLive 2s infinite ease-in-out;
        box-shadow: 0 0 12px rgba(211, 47, 47, 0.5);
      }
      @keyframes pulseLive {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.75;
        }
      }
      .live-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        background: #ffffff;
        border-radius: 50%;
      }
      @keyframes spinIcon {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .sync-icon.spinning {
        animation: spinIcon 1s linear infinite;
      }

      /* Scoreboard Goalscorers in Hero */
      .team-hero-scorers {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        margin-top: 8px;
        max-width: 260px;
      }
      .team-hero-scorer-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: "Space Mono", monospace;
        font-size: 0.82rem;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.04);
        padding: 4px 12px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.07);
        transition: all 0.2s ease;
      }
      .team-hero-scorer-item:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(212, 175, 55, 0.3);
      }
      .team-hero-scorer-item a {
        color: var(--gold);
        text-decoration: none;
        font-weight: 700;
      }
      .team-hero-scorer-item a:hover {
        text-decoration: underline;
      }
      .team-hero-scorer-item .scorer-minute {
        color: var(--gold);
        font-weight: 700;
      }
      .team-hero-scorer-item .scorer-assist {
        color: var(--ink-muted);
        font-size: 0.72rem;
        margin-left: 2px;
      }

      /* Live Sync Banner */
      .live-sync-banner {
        background: linear-gradient(135deg, rgba(3, 25, 75, 0.65) 0%, rgba(5, 38, 107, 0.45) 100%);
        border: 1px solid rgba(0, 102, 255, 0.35);
        border-radius: 10px;
        padding: 12px 20px;
        margin-bottom: 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 14px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(8px);
      }
      .live-pulse-dot {
        width: 10px;
        height: 10px;
        background: #00e676;
        border-radius: 50%;
        box-shadow: 0 0 10px #00e676;
        display: inline-block;
        animation: pulseLive 1.5s infinite;
      }

      /* Details Grid Layout */
      .details-grid {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 40px;
        align-items: start;
      }
      @media (max-width: 880px) {
        .scoreboard-grid {
          grid-template-columns: 1fr;
          gap: 20px;
        }
        .score-main {
          font-size: 4rem;
        }
        .details-grid {
          grid-template-columns: 1fr !important;
          gap: 28px;
        }
        .sidebar-meta {
          padding-bottom: 8px;
        }
      }

      /* Sidebar Meta & Cards */
      .sidebar-meta {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .sidebar-card {
        background: var(--card-bg, #0b1528);
        border: 1px solid var(--ink-faint, rgba(255, 255, 255, 0.08));
        border-radius: 10px;
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      }
      .sidebar-card-title {
        font-family: "Space Mono", monospace;
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--gold);
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--ink-faint, rgba(255, 255, 255, 0.08));
      }
      .sidebar-card-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .sidebar-info-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-size: 0.88rem;
        padding: 2px 0;
      }
      .sidebar-info-label {
        font-family: "Space Mono", monospace;
        font-size: 0.72rem;
        color: var(--ink-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }
      .sidebar-info-val {
        font-weight: 600;
        color: var(--ink);
        text-align: right;
      }
      .channel-badges-wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 4px;
      }
      .channel-badge-item {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--ink-faint);
        padding: 6px 12px;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .channel-badge-item img {
        height: 18px;
        object-fit: contain;
      }

      /* Goalscorers in Sidebar Summary */
      .goals-grid {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .col-team-name {
        font-family: "Space Mono", monospace;
        font-size: 0.7rem;
        color: var(--ink-muted);
        border-bottom: 1px solid var(--ink-faint);
        padding-bottom: 6px;
        margin-bottom: 8px;
        text-transform: uppercase;
        font-weight: 700;
      }
      .goals-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .goals-list li {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 6px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        font-size: 0.85rem;
      }
      .goal-entry-main {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
      }
      .goal-assist-info {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 0.76rem;
        color: var(--ink-muted);
        padding-left: 38px;
        margin-top: 1px;
      }
      .goal-assist-info .assist-icon-img {
        width: 14px;
        height: 14px;
        object-fit: contain;
        vertical-align: middle;
        filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
      }
      .goal-assist-info a.assist-link {
        color: var(--gold);
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s;
      }
      .goal-assist-info a.assist-link:hover {
        text-decoration: underline;
      }
      .scorer-link-plain {
        color: var(--ink);
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .hero-scorer-assist {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 0.72rem;
        color: var(--ink-muted);
        font-weight: 500;
        margin-left: 5px;
        opacity: 0.88;
        vertical-align: middle;
      }
      .hero-scorer-assist img {
        width: 13px;
        height: 13px;
        object-fit: contain;
        vertical-align: middle;
      }
      .goals-list img.goal-player-img {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        object-fit: cover;
        border: 1px solid var(--gold);
      }
      .goals-list .goal-time {
        font-family: "Space Mono", monospace;
        font-size: 0.75rem;
        color: var(--gold);
        margin-left: auto;
        font-weight: 700;
      }
      .goals-list .no-goals {
        color: var(--ink-muted);
        font-size: 0.8rem;
        font-style: italic;
      }
      .scorer-link {
        color: var(--ink);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: color 0.2s;
      }

      @keyframes eventEntrance {
        from {

        to {

      .event-detail-group {

        animation: eventEntrance 0.45s cubic-bezier(0.16, 1, 0.3, 1) backwards;
        animation-delay: calc(var(--event-index, 0) * 0.05s);

      /* Cascading animation delays for match events */
      .timeline-events-list > .timeline-event-card:nth-child(1) .event-detail-group { animation-delay: 0.04s; }
      .timeline-events-list > .timeline-event-card:nth-child(2) .event-detail-group { animation-delay: 0.08s; }
      .timeline-events-list > .timeline-event-card:nth-child(3) .event-detail-group { animation-delay: 0.12s; }
      .timeline-events-list > .timeline-event-card:nth-child(4) .event-detail-group { animation-delay: 0.16s; }
      .timeline-events-list > .timeline-event-card:nth-child(5) .event-detail-group { animation-delay: 0.20s; }
      .timeline-events-list > .timeline-event-card:nth-child(6) .event-detail-group { animation-delay: 0.24s; }
      .timeline-events-list > .timeline-event-card:nth-child(7) .event-detail-group { animation-delay: 0.28s; }
      .timeline-events-list > .timeline-event-card:nth-child(8) .event-detail-group { animation-delay: 0.32s; }
      .timeline-events-list > .timeline-event-card:nth-child(9) .event-detail-group { animation-delay: 0.36s; }
      .timeline-events-list > .timeline-event-card:nth-child(10) .event-detail-group { animation-delay: 0.40s; }
      .timeline-events-list > .timeline-event-card:nth-child(11) .event-detail-group { animation-delay: 0.44s; }
      .timeline-events-list > .timeline-event-card:nth-child(12) .event-detail-group { animation-delay: 0.48s; }
      .timeline-events-list > .timeline-event-card:nth-child(13) .event-detail-group { animation-delay: 0.52s; }
      .timeline-events-list > .timeline-event-card:nth-child(14) .event-detail-group { animation-delay: 0.56s; }
      .timeline-events-list > .timeline-event-card:nth-child(15) .event-detail-group { animation-delay: 0.60s; }
      .timeline-events-list > .timeline-event-card:nth-child(n+16) .event-detail-group { animation-delay: 0.64s; }

    <script>
      // ---------- Player Lookup Maps ----------
      let playerImageMap = {};
      let playerIdMap = {};
      let playerTeamMap = {};
      let playerNumberMap = {};

      function normalizeName(str) {
        if (!str) return "";
        return str
          .toLowerCase()
          .replace(/-/g, " ")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9 ]/g, "")
          .trim();
      }

      function getPlayerImage(playerName) {
        if (!playerName) return "assets/images/placeholder-player.svg";
        const norm = normalizeName(playerName);

        if (playerImageMap[norm]) return playerImageMap[norm];

        for (const [k, imgUrl] of Object.entries(playerImageMap)) {
          if (norm.includes(k) || k.includes(norm)) {
            return imgUrl;
          }
        }

        if (norm.includes("satpaev")) return "assets/images/players/men/dastan-satpaev.webp";
        if (norm.includes("essugo")) return "assets/images/players/men/dario-essugo.webp";
        if (norm.includes("gittens")) return "assets/images/players/men/jamie-bynoe-gittens.webp";
        if (norm.includes("rogers")) return "assets/images/players/men/morgan-rogers.webp";
        if (norm.includes("palmer")) return "assets/images/players/men/cole-palmer.webp";
        if (norm.includes("caicedo")) return "assets/images/players/men/moises-caicedo.webp";
        if (norm.includes("james")) return "assets/images/players/men/james.webp";
        if (norm.includes("estevao")) return "assets/images/players/men/estevao.webp";
        if (norm.includes("pedro")) return "assets/images/players/men/joao-pedro.webp";
        if (norm.includes("enzo") || norm.includes("fernandez"))
          return "assets/images/players/men/enzo-fernandez.webp";

        const slug = norm.replace(/\s+/g, "-");
        return `assets/images/players/men/${slug}.webp`;
      }

      function getPlayerIdByName(playerName, playerNumber, teamType = "men") {
        const normalizedTeam = teamType === "W" || teamType === "women" ? "women" : "men";
        if (playerNumber) {
          if (playerNumberMap[`${normalizedTeam}_${playerNumber}`]) {
            return playerNumberMap[`${normalizedTeam}_${playerNumber}`];
          }
          if (playerNumberMap[`men_${playerNumber}`]) return playerNumberMap[`men_${playerNumber}`];
          if (playerNumberMap[`women_${playerNumber}`])
            return playerNumberMap[`women_${playerNumber}`];
        }
        if (!playerName) return null;
        const norm = normalizeName(playerName);
        if (playerIdMap[`${normalizedTeam}_${norm}`])
          return playerIdMap[`${normalizedTeam}_${norm}`];
        if (playerIdMap[norm]) return playerIdMap[norm];
        for (const [k, idVal] of Object.entries(playerIdMap)) {
          if (norm === k) return idVal;
        }
        const parts = norm.split(" ").filter((p) => p.length > 2);
        for (const part of parts) {
          if (playerIdMap[part]) return playerIdMap[part];
        }
        for (const [k, idVal] of Object.entries(playerIdMap)) {
          if (k.length > 2 && (norm.includes(k) || k.includes(norm))) {
            return idVal;
          }
        }
        return null;
      }

      function getPlayerTeamByName(playerName, defaultTeam) {
        if (!playerName) return defaultTeam || "men";
        const norm = normalizeName(playerName);
        if (playerTeamMap[norm]) return playerTeamMap[norm];
        const parts = norm.split(" ").filter((p) => p.length > 2);
        for (const part of parts) {
          if (playerTeamMap[part]) return playerTeamMap[part];
        }
        for (const [k, teamVal] of Object.entries(playerTeamMap)) {
          if (norm.includes(k) || k.includes(norm)) return teamVal;
        }
        return defaultTeam || "men";
      }

      function formatDate(dateString, lang) {
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return dateString;
        if (lang === "th") {
          const thaiMonths = [
            "ม.ค.",
            "ก.พ.",
            "มี.ค.",
            "เม.ย.",
            "พ.ค.",
            "มิ.ย.",
            "ก.ค.",
            "ส.ค.",
            "ก.ย.",
            "ต.ค.",
            "พ.ย.",
            "ธ.ค.",
          ];
          const thaiYear = date.getFullYear() + 543;
          return `${date.getDate()} ${thaiMonths[date.getMonth()]} ${thaiYear}`;
        }
        return date.toLocaleDateString("en-GB", {
          year: "numeric",
          month: "short",
          day: "numeric",
        });
      }

      function formatCompetitionName(name) {
        if (!name) return "";
        return name
          .replace(/-/g, " ")
          .split(" ")
          .map((w) => w.charAt(0).toUpperCase() + w.slice(1))
          .join(" ");
      }

      // ---------- Tab Initialization ----------
      function initTabs() {
        const tabBtns = document.querySelectorAll(".tab-btn");
        const tabPanes = document.querySelectorAll(".tab-pane");

        tabBtns.forEach((btn) => {
          btn.addEventListener("click", () => {
            tabBtns.forEach((b) => b.classList.remove("active"));
            tabPanes.forEach((p) => p.classList.remove("active"));

            btn.classList.add("active");
            const targetId = btn.getAttribute("data-target");
            const targetPane = document.getElementById(targetId);
            if (targetPane) {
              targetPane.classList.add("active");
            }
          });
        });

        // Handle activeIndex or tab from URL params
        const urlParams = new URLSearchParams(window.location.search);
        const activeIdx = urlParams.get("activeIndex");
        const tabParam = urlParams.get("tab");
        let defaultTargetId = null;

        if (activeIdx === "3" || tabParam === "stats") {
          defaultTargetId = "tab-stats";
        } else if (activeIdx === "1" || tabParam === "lineups") {
          defaultTargetId = "tab-lineups";
        } else if (activeIdx === "2" || tabParam === "timeline") {
          defaultTargetId = "tab-timeline";
        } else if (activeIdx === "4" || tabParam === "video") {
          defaultTargetId = "tab-video";
        } else if (!tabParam && !activeIdx && currentMatch) {
          if (currentMatch.status === "upcoming" && currentMatch.lineups) {
            defaultTargetId = "tab-lineups";
          }
        }

        if (defaultTargetId) {
          const targetBtn = document.querySelector(`.tab-btn[data-target="${defaultTargetId}"]`);
          if (targetBtn) {
            targetBtn.click();
          }
        }

        // Initialize Commentary filter buttons
        const filterBtns = document.querySelectorAll(".commentary-filter-btn");
        const commentItems = document.querySelectorAll(".live-comment-item");
        if (filterBtns.length > 0 && commentItems.length > 0) {
          filterBtns.forEach((btn) => {
            btn.addEventListener("click", () => {
              filterBtns.forEach((b) => b.classList.remove("active"));
              btn.classList.add("active");
              const filter = btn.getAttribute("data-filter");
              commentItems.forEach((item) => {
                const cats = (item.getAttribute("data-category") || "").split(" ");
                if (filter === "all" || cats.includes(filter)) {
                  item.style.display = "flex";
                } else {
                  item.style.display = "none";
                }
              });
            });
          });
        }
      }

      // ---------- Match Stats HTML Generator ----------
      function generateMatchStatsHTML(statsArray, homeTeamName, awayTeamName, lang) {
        const isTh = lang !== "en";
        if (!statsArray || statsArray.length === 0) {
          return `
          <div class="empty-tab-box">
            <div style="font-size: 1.5rem; margin-bottom: 8px;">📊</div>
            <strong style="color: var(--ink);">${isTh ? "ไม่มีข้อมูลสถิติสำหรับการแข่งขันนี้" : "No match statistics available"}</strong>
            <p>${isTh ? "สถิติจะแสดงผลเมื่อการแข่งขันเริ่มต้นขึ้น" : "Stats will update once match begins."}</p>
          </div>
        `;
        }

        const isHomeChelsea = homeTeamName && homeTeamName.toLowerCase().includes("chelsea");
        const isAwayChelsea = awayTeamName && awayTeamName.toLowerCase().includes("chelsea");
        const homeLogo = currentMatch ? currentMatch.home_logo : "";
        const awayLogo = currentMatch ? currentMatch.away_logo : "";

        let html = `
        <div class="stats-card">
          <div class="stats-header-bar">
            <div class="stats-header-team">
              ${homeLogo ? `<img src="${homeLogo}" alt="${homeTeamName}" onerror="this.src='assets/images/placeholder-team.svg'">` : ""}
              <span style="${isHomeChelsea ? "color: var(--gold);" : "color: var(--ink);"}">${window.renderTeamNameHTML ? window.renderTeamNameHTML(homeTeamName) : homeTeamName}</span>
            </div>
            <div class="stats-vs-badge">VS</div>
            <div class="stats-header-team" style="justify-content: flex-end;">
              <span style="${isAwayChelsea ? "color: var(--gold);" : "color: var(--ink);"}">${window.renderTeamNameHTML ? window.renderTeamNameHTML(awayTeamName) : awayTeamName}</span>
              ${awayLogo ? `<img src="${awayLogo}" alt="${awayTeamName}" onerror="this.src='assets/images/placeholder-team.svg'">` : ""}
            </div>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--ink-faint); font-family: 'Space Mono', monospace; font-size: 0.78rem; color: var(--gold); text-transform: uppercase; letter-spacing: 0.08em;">
            <span>📊 ${isTh ? "สถิติการแข่งขันอย่างเป็นทางการ" : "Official Match Statistics"}</span>
            <span style="color: var(--ink-muted); font-size: 0.72rem;">Premier League</span>
          </div>
      `;
        statsArray.forEach((stat) => {
          const homeVal = parseFloat(stat.home) || 0;
          const awayVal = parseFloat(stat.away) || 0;
          const total = homeVal + awayVal;

          let homeWidth = total > 0 ? (homeVal / total) * 100 : 50;
          let awayWidth = total > 0 ? (awayVal / total) * 100 : 50;

          const displayHome = stat.isPercentage ? `${stat.home}%` : stat.home;
          const displayAway = stat.isPercentage ? `${stat.away}%` : stat.away;

          const homeLead = homeVal > awayVal;
          const awayLead = awayVal > homeVal;

          let displayName = stat.name;
          if (!isTh && stat.name.includes("(") && stat.name.includes(")")) {
            const matchEn = stat.name.match(/\((.*?)\)/);
            if (matchEn) displayName = matchEn[1];
          }

          html += `
          <div class="stat-row">
            <div class="stat-labels">
              <span class="stat-value-home ${homeLead ? "stat-highlight" : ""}">${displayHome}</span>
              <span class="stat-name">${displayName}</span>
              <span class="stat-value-away ${awayLead ? "stat-highlight" : ""}">${displayAway}</span>
            </div>
            <div class="stat-bar-container">
              <div class="stat-bar-home" style="width: ${homeWidth}%;"></div>
              <div class="stat-bar-away" style="width: ${awayWidth}%;"></div>
            </div>
          </div>
        `;
        });
        html += `</div>`;
        return html;
      }

      // ---------- Load Match Data ----------
      let currentMatch = null;

      async function loadMatchDetail() {
        const container = document.getElementById("matchContent");
        try {
          const params = new URLSearchParams(window.location.search);
          let matchId = params.get("id");
          const teamParam = params.get("team") || "";

          // Load players data
          try {
            let playersMen = [];
            if (typeof fetchPlayersFromSheet === "function") {
              try {
                playersMen = (await fetchPlayersFromSheet(true)) || [];
              } catch (e) {}
            }
            if (!playersMen || playersMen.length === 0) {
              const resPMen = await fetch("data/players-men.json");
              if (resPMen.ok) playersMen = await resPMen.json();
            }

            if (playersMen && playersMen.length > 0) {
              playersMen.forEach((p) => {
                if (p.name) {
                  const n = normalizeName(p.name);
                  if (p.image) playerImageMap[n] = p.image;
                  if (p.id) {
                    playerIdMap[n] = p.id;
                    if (p.number) playerNumberMap[`men_${p.number}`] = p.id;
                  }
                  playerTeamMap[n] = "men";
                  const parts = n.split(" ");
                  if (parts.length > 1) {
                    const last = parts[parts.length - 1];
                    if (last.length > 2) {
                      if (!playerImageMap[last] && p.image) playerImageMap[last] = p.image;
                      if (!playerIdMap[last] && p.id) playerIdMap[last] = p.id;
                      if (!playerTeamMap[last]) playerTeamMap[last] = "men";
                    }
                  }
                }
              });
            }
          } catch (e) {
            console.warn("Error loading men players", e);
          }

          try {
            let playersWomen = [];
            if (typeof fetchPlayersFromSheet === "function") {
              try {
                playersWomen = (await fetchPlayersFromSheet(false)) || [];
              } catch (e) {}
            }
            if (!playersWomen || playersWomen.length === 0) {
              const resPWomen = await fetch("data/players-women.json");
              if (resPWomen.ok) playersWomen = await resPWomen.json();
            }

            if (playersWomen && playersWomen.length > 0) {
              playersWomen.forEach((p) => {
                if (p.name) {
                  const n = normalizeName(p.name);
                  if (p.image) playerImageMap[n] = p.image;
                  if (p.id) {
                    playerIdMap[n] = p.id;
                    if (p.number) playerNumberMap[`women_${p.number}`] = p.id;
                  }
                  playerTeamMap[n] = "women";
                  const parts = n.split(" ");
                  if (parts.length > 1) {
                    const last = parts[parts.length - 1];
                    if (last.length > 2) {
                      if (!playerImageMap[last] && p.image) playerImageMap[last] = p.image;
                      if (!playerIdMap[last] && p.id) playerIdMap[last] = p.id;
                      if (!playerTeamMap[last]) playerTeamMap[last] = "women";
                    }
                  }
                }
              });
            }
          } catch (e) {
            console.warn("Error loading women players", e);
          }

          // Fetch fixtures
          let allMatches = [];
          try {
            const res = await fetch("data/fixtures.json");
            if (res.ok) allMatches = await res.json();
          } catch (e) {}

          if (teamParam === "women" || (matchId && matchId.startsWith("w"))) {
            try {
              const resW = await fetch("data/fixtures-women.json");
              if (resW.ok) {
                const womenMatches = await resW.json();
                if (Array.isArray(womenMatches)) {
                  // Merge women matches
                  womenMatches.forEach(wm => {
                    const idx = allMatches.findIndex(m => String(m.id) === String(wm.id));
                    if (idx >= 0) allMatches[idx] = { ...allMatches[idx], ...wm };
                    else allMatches.push(wm);
                  });
                }
              }
            } catch (e) {}
          }

          // Helper to find match by ID or alias (m01, m1, m2, etc.)
          function findMatchByIdOrAlias(fixturesList, targetId) {
            if (!targetId || !Array.isArray(fixturesList)) return null;
            const tid = String(targetId).toLowerCase().trim();
            // 1. Exact string match or alias match
            let found = fixturesList.find(m => 
              String(m.id).toLowerCase() === tid || 
              (m.alias_id && String(m.alias_id).toLowerCase() === tid) ||
              (tid === "w_uwcl_landhaus" && String(m.id).toLowerCase() === "w_uwcl_3")
            );
            if (found) return found;

            // 2. Normalize leading zeroes: m01 <-> m1, m02 <-> m2, w01 <-> w1
            if (tid.startsWith("m") || tid.startsWith("w")) {
              const prefix = tid[0];
              const numPart = parseInt(tid.slice(1), 10);
              if (!isNaN(numPart)) {
                found = fixturesList.find(m => {
                  const mid = String(m.id).toLowerCase();
                  if (mid.startsWith(prefix)) {
                    const mNum = parseInt(mid.slice(1), 10);
                    return mNum === numPart;
                  }
                  return false;
                });
                if (found) return found;
              }
            }

            // 3. Numeric ID (e.g. Football-Data match ID)
            const numId = parseInt(tid, 10);
            if (!isNaN(numId)) {
              found = fixturesList.find(m => m.id === numId || m.fd_id === numId);
              if (found) return found;
            }
            return null;
          }

          let match = null;
          if (matchId) {
            match = findMatchByIdOrAlias(allMatches, matchId);
          }

          // Check if this is a men's match
          const isWomenMatch =
            teamParam === "women" ||
            (matchId && String(matchId).toLowerCase().startsWith("w")) ||
            (match && (match.team_type === "women" || match.team_type === "W"));

          let footballDataMatches = [];

          // ALWAYS load /api/football-data/teams/61/matches for men's team matches
          if (!isWomenMatch) {
            try {
              const fdRes = await fetch(`/api/football-data/teams/61/matches?_t=${Date.now()}`);
              if (fdRes.ok) {
                const fdJson = await fdRes.json();
                if (fdJson && Array.isArray(fdJson.matches)) {
                  footballDataMatches = fdJson.matches;
                  window.footballDataMatches = footballDataMatches;

                  // If match wasn't found in fixtures.json, find or construct it from Football-Data
                  if (!match) {
                    const matchedFd = findFootballDataMatch(footballDataMatches, null, matchId);
                    if (matchedFd) {
                      match = convertFdMatchToLocalFormat(matchedFd, matchId);
                      allMatches.push(match);
                    }
                  }

                  // Apply latest Football-Data live info if matched
                  if (match) {
                    const matchedFd = findFootballDataMatch(footballDataMatches, match, matchId);
                    if (matchedFd) {
                      applyFootballDataLive(match, matchedFd);
                    }
                  }
                }
              }
            } catch (fdErr) {
              console.warn("Football-data live fetch error:", fdErr);
            }
          }

          // Fallback to match with commentary/lineups (e.g. m9 or first match) if none found or no ID
          if (!match && allMatches.length > 0) {
            match = allMatches.find((m) => m.id === "m9") || allMatches[0];
            if (match && !isWomenMatch && footballDataMatches.length > 0) {
              const matchedFd = findFootballDataMatch(footballDataMatches, match, match.id);
              if (matchedFd) applyFootballDataLive(match, matchedFd);
            }
          }

          if (!match) {
            container.innerHTML =
              '<div class="empty-tab-box"><p>⚠️ ไม่พบข้อมูลการแข่งขัน</p></div>';
            return;
          }

          // Real-Time Sync from EFL API if match is m46 or has efl_id
          if (match.id === "m46" || match.efl_id) {
            try {
              const fixtureId = match.efl_id || "g2685176";
              const eflRes = await fetch(`/api/efl-match?fixtureId=${fixtureId}&_t=${Date.now()}`);
              if (eflRes.ok) {
                const eflJson = await eflRes.json();
                if (eflJson.success && eflJson.data) {
                  applyEflLiveData(match, eflJson.data);
                }
              }
            } catch (e) {
              console.warn("EFL live fetch error:", e);
            }
          }

          // Real-Time Sync from Premier League API if match is m10 or has pl_match_id
          if (match.pl_match_id) {
            try {
              const plId = match.pl_match_id;
              if (plId) {
                const plRes = await fetch(`/api/pl-match?matchId=${plId}&_t=${Date.now()}`);
                if (plRes.ok) {
                  const plJson = await plRes.json();
                  if (plJson.success) {
                    applyPlLiveData(match, plJson);
                  }
                }
              }
            } catch (e) {
              console.warn("PL live fetch error:", e);
            }
          }

          renderMatchDetail(match, container);
          startRealTimeSync(match);
        } catch (error) {
          console.error(error);
          container.innerHTML =
            '<div class="empty-tab-box"><p>⚠️ ไม่สามารถโหลดข้อมูลได้ในขณะนี้</p></div>';
        }
      }

      // Helper: Find Football-Data Match for a given local match / ID
      function findFootballDataMatch(fdMatches, localMatch, matchId) {
        if (!Array.isArray(fdMatches) || fdMatches.length === 0) return null;
        const normId = matchId ? String(matchId).toLowerCase().trim() : "";
        const mNum = parseInt(normId.replace(/\D/g, ""), 10);

        // 1. Direct numeric ID check
        if (normId && !isNaN(normId)) {
          const targetNum = parseInt(normId, 10);
          const found = fdMatches.find(m => m.id === targetNum);
          if (found) return found;
        }

        // 2. Exact match on localMatch.fd_id
        if (localMatch && localMatch.fd_id) {
          const found = fdMatches.find(m => m.id === localMatch.fd_id);
          if (found) return found;
        }

        // 3. Exact date + opponent matching
        if (localMatch && localMatch.date) {
          const matchDateStr = localMatch.date;
          const locH = (localMatch.home_team || "").toLowerCase();
          const locA = (localMatch.away_team || "").toLowerCase();

          const foundByDate = fdMatches.find(m => {
            const fdDate = m.utcDate ? m.utcDate.split("T")[0] : "";
            if (fdDate !== matchDateStr) return false;
            const hName = (m.homeTeam?.name || m.homeTeam?.shortName || "").toLowerCase();
            const aName = (m.awayTeam?.name || m.awayTeam?.shortName || "").toLowerCase();
            return (
              (locH.includes(hName.substring(0, 4)) || hName.includes(locH.substring(0, 4))) ||
              (locA.includes(aName.substring(0, 4)) || aName.includes(locA.substring(0, 4)))
            );
          });
          if (foundByDate) return foundByDate;
        }

        // 4. Matchday round number matching for PL
        if (localMatch && localMatch.round) {
          const roundNum = parseInt(String(localMatch.round).replace(/\D/g, ""), 10);
          if (roundNum) {
            const foundByRound = fdMatches.find(m => m.matchday === roundNum && m.competition?.code === "PL");
            if (foundByRound) return foundByRound;
          }
        }

        // 5. If matchId is m1..m38 (standard Premier League fixture matchdays)
        if (normId.startsWith("m") && mNum >= 1 && mNum <= 38) {
          const foundByMatchday = fdMatches.find(m => m.matchday === mNum);
          if (foundByMatchday) return foundByMatchday;
        }

        // 6. Opponent Name matching
        if (localMatch) {
          const locH = (localMatch.home_team || "").toLowerCase();
          const locA = (localMatch.away_team || "").toLowerCase();
          const isHomeChe = locH.includes("chelsea");
          const oppKey = (isHomeChe ? locA : locH).replace(/fc|chelsea/g, "").trim();

          if (oppKey.length >= 3) {
            const foundByOpp = fdMatches.find(m => {
              const hName = (m.homeTeam?.name || m.homeTeam?.shortName || "").toLowerCase();
              const aName = (m.awayTeam?.name || m.awayTeam?.shortName || "").toLowerCase();
              return hName.includes(oppKey.substring(0, 4)) || aName.includes(oppKey.substring(0, 4));
            });
            if (foundByOpp) return foundByOpp;
          }
        }

        return null;
      }

      // Convert Football-Data Match to Local Schema if not already in fixtures.json
      function convertFdMatchToLocalFormat(fdMatch, reqId) {
        const isChelseaHome = fdMatch.homeTeam?.id === 61 || (fdMatch.homeTeam?.name || "").includes("Chelsea");
        const matchDate = fdMatch.utcDate ? fdMatch.utcDate.split("T")[0] : new Date().toISOString().split("T")[0];
        const matchTime = fdMatch.utcDate ? fdMatch.utcDate.split("T")[1]?.substring(0, 5) || "19:00" : "19:00";

        let status = "upcoming";
        if (fdMatch.status === "FINISHED") status = "completed";
        else if (fdMatch.status === "IN_PLAY") status = "live";
        else if (fdMatch.status === "PAUSED") status = "halftime";

        return {
          id: reqId || `m${fdMatch.matchday || fdMatch.id}`,
          fd_id: fdMatch.id,
          team_type: "men",
          date: matchDate,
          time: matchTime,
          time_uk: matchTime,
          competition: "premier-league",
          competition_name: fdMatch.competition?.name || "Premier League",
          competition_logo: fdMatch.competition?.emblem || "databases/logo/competitions/men/premier-league.png",
          round: fdMatch.matchday ? `Matchday ${fdMatch.matchday}` : "Premier League",
          matchday: fdMatch.matchday,
          venue: isChelseaHome ? "Stamford Bridge" : `${fdMatch.homeTeam?.shortName || fdMatch.homeTeam?.name || "Opponent"} Stadium`,
          home_team: fdMatch.homeTeam?.shortName || fdMatch.homeTeam?.name || "Chelsea FC",
          home_logo: isChelseaHome ? "databases/logo/teams/england_chelsea.svg" : (fdMatch.homeTeam?.crest || ""),
          away_team: fdMatch.awayTeam?.shortName || fdMatch.awayTeam?.name || "Opponent",
          away_logo: !isChelseaHome ? "databases/logo/teams/england_chelsea.svg" : (fdMatch.awayTeam?.crest || ""),
          home_score: fdMatch.score?.fullTime?.home ?? null,
          away_score: fdMatch.score?.fullTime?.away ?? null,
          home_half_score: fdMatch.score?.halfTime?.home ?? null,
          away_half_score: fdMatch.score?.halfTime?.away ?? null,
          status: status,
          period: fdMatch.status === "FINISHED" ? "FullTime" : fdMatch.status === "PAUSED" ? "HalfTime" : "",
          referee: fdMatch.referees?.[0]?.name || "",
          goals: [],
          events: [],
          stats: null,
          channels: [{ name: "MONOMAX SPORTS TV", logo: "databases/logo/tv/monomax.svg" }]
        };
      }

      // Apply live attributes from Football-Data Match to Local Match object
      function applyFootballDataLive(match, fdMatch) {
        if (!match || !fdMatch) return false;
        let changed = false;

        // Status mapping
        let newStatus = match.status;
        if (fdMatch.status === "FINISHED") {
          newStatus = "completed";
          match.period = "FullTime";
        } else if (fdMatch.status === "IN_PLAY") {
          newStatus = "live";
        } else if (fdMatch.status === "PAUSED") {
          newStatus = "halftime";
          match.period = "HalfTime";
        } else if (fdMatch.status === "TIMED" || fdMatch.status === "SCHEDULED") {
          newStatus = "upcoming";
        }

        if (match.status !== newStatus) {
          match.status = newStatus;
          changed = true;
        }

        // Score mapping with team alignment check
        if (fdMatch.score && fdMatch.score.fullTime) {
          const isChelseaHome = fdMatch.homeTeam?.id === 61 || (fdMatch.homeTeam?.name || "").includes("Chelsea");
          const localHomeChelsea = (match.home_team || "").toLowerCase().includes("chelsea");

          let fdHomeScore = fdMatch.score.fullTime.home;
          let fdAwayScore = fdMatch.score.fullTime.away;

          // Swap if local home/away orientation differs from Football-Data
          if (isChelseaHome !== localHomeChelsea) {
            const tmp = fdHomeScore;
            fdHomeScore = fdAwayScore;
            fdAwayScore = tmp;
          }

          if (fdHomeScore !== null && fdHomeScore !== undefined && match.home_score !== fdHomeScore) {
            match.home_score = fdHomeScore;
            changed = true;
          }
          if (fdAwayScore !== null && fdAwayScore !== undefined && match.away_score !== fdAwayScore) {
            match.away_score = fdAwayScore;
            changed = true;
          }

          if (fdMatch.score.halfTime) {
            match.home_half_score = fdMatch.score.halfTime.home;
            match.away_half_score = fdMatch.score.halfTime.away;
          }
        }

        // Referee info
        if (fdMatch.referees && fdMatch.referees.length > 0 && !match.referee) {
          match.referee = fdMatch.referees[0].name;
        }

        // Competition details
        if (fdMatch.competition) {
          if (!match.competition_name) match.competition_name = fdMatch.competition.name;
          match.competition_code = fdMatch.competition.code;
          if (fdMatch.competition.emblem && !match.competition_logo) {
            match.competition_logo = fdMatch.competition.emblem;
          }
        }

        // Matchday
        if (fdMatch.matchday) {
          match.matchday = fdMatch.matchday;
          if (!match.round) match.round = `Matchday ${fdMatch.matchday}`;
        }

        match.fd_id = fdMatch.id;
        match.last_synced = new Date().toISOString();

        return changed;
      }

      function applyEflLiveData(match, live) {
        if (!match || !live) return;
        if (live.status) match.status = live.status;
        if (live.time_live) match.time_live = live.time_live;
        if (live.home_score !== undefined && live.home_score !== null)
          match.home_score = live.home_score;
        if (live.away_score !== undefined && live.away_score !== null)
          match.away_score = live.away_score;
        if (live.goals && Array.isArray(live.goals) && live.goals.length > 0)
          match.goals = live.goals;
        if (live.events && Array.isArray(live.events) && live.events.length > 0)
          match.events = live.events;
        if (live.stats && Array.isArray(live.stats) && live.stats.length > 0)
          match.stats = live.stats;
        if (live.video) match.video = live.video;
        if (live.youtube_id) match.youtube_id = live.youtube_id;
      }

      function applyPlLiveData(match, live) {
        if (!match || !live) return;
        if (live.status) match.status = live.status;
        if (live.clock) match.clock = live.clock;
        if (live.period) match.period = live.period;
        if (live.score) {
          if (live.score.home !== undefined) match.home_score = live.score.home;
          if (live.score.away !== undefined) match.away_score = live.score.away;
        }
        if (live.goals && Array.isArray(live.goals) && live.goals.length >= (match.goals?.length || 0))
          match.goals = live.goals;
        if (live.events && Array.isArray(live.events) && live.events.length >= (match.events?.length || 0))
          match.events = live.events;
        if (live.stats && Array.isArray(live.stats) && live.stats.length > 0)
          match.stats = live.stats;
        if (
          live.live_commentary &&
          Array.isArray(live.live_commentary) &&
          live.live_commentary.length > 0
        ) {
          match.live_commentary = live.live_commentary;
        }
        if (live.lastUpdated) match.last_synced = live.lastUpdated;
      }

      let livePollInterval = null;
      let isManualSyncing = false;

      window.handleManualLiveSync = async function () {
        if (!currentMatch || isManualSyncing) return;
        isManualSyncing = true;
        const btn = document.getElementById("btnManualSync");
        const icon = btn ? btn.querySelector(".sync-icon") : null;
        if (icon) icon.classList.add("spinning");

        try {
          let updated = false;

          // 1. Check Premier League live proxy
          if (currentMatch.pl_match_id) {
            const plId = currentMatch.pl_match_id;
            const res = await fetch(`/api/pl-match?matchId=${plId}&_t=${Date.now()}`);
            if (res.ok) {
              const json = await res.json();
              if (json.success) {
                applyPlLiveData(currentMatch, json);
                updated = true;
              }
            }
          }

          // 2. Check EFL live proxy
          if (currentMatch.id === "m46" || currentMatch.efl_id) {
            const fixtureId = currentMatch.efl_id || "g2685176";
            const res = await fetch(`/api/efl-match?fixtureId=${fixtureId}&_t=${Date.now()}`);
            if (res.ok) {
              const json = await res.json();
              if (json.success && json.data) {
                applyEflLiveData(currentMatch, json.data);
                updated = true;
              }
            }
          }

          // 3. Check Football-Data endpoint for Men's team matches
          const isMen = currentMatch.team_type !== "women" && currentMatch.team_type !== "W" && !String(currentMatch.id).toLowerCase().startsWith("w");
          if (isMen) {
            try {
              const fdRes = await fetch(`/api/football-data/teams/61/matches?_t=${Date.now()}`);
              if (fdRes.ok) {
                const fdJson = await fdRes.json();
                if (fdJson && Array.isArray(fdJson.matches)) {
                  window.footballDataMatches = fdJson.matches;
                  const matchedFd = findFootballDataMatch(fdJson.matches, currentMatch, currentMatch.id);
                  if (matchedFd) {
                    applyFootballDataLive(currentMatch, matchedFd);
                    updated = true;
                  }
                }
              }
            } catch (e) {
              console.warn("Football-data manual sync error:", e);
            }
          }

          if (updated) {
            const container = document.getElementById("matchContent");
            if (container) {
              const activeBtn = document.querySelector(".tab-btn.active");
              const activeTarget = activeBtn ? activeBtn.getAttribute("data-target") : null;
              renderMatchDetail(currentMatch, container);
              if (activeTarget) {
                const newBtn = document.querySelector(
                  `.tab-btn[data-target="${activeTarget}"]`
                );
                if (newBtn) newBtn.click();
              }
            }
          }
        } catch (err) {
          console.warn("Manual sync failed:", err);
        } finally {
          isManualSyncing = false;
          if (icon) icon.classList.remove("spinning");
        }
      };

      function startRealTimeSync(match) {
        if (livePollInterval) {
          clearInterval(livePollInterval);
          livePollInterval = null;
        }
        const isMen = match && match.team_type !== "women" && match.team_type !== "W" && !String(match.id).toLowerCase().startsWith("w");
        const isEfl = match && (match.id === "m46" || match.efl_id);
        const isPl = match && match.pl_match_id;

        // Auto-poll if match is live or scheduled today
        const isToday = match && match.date === new Date().toISOString().split("T")[0];
        const isLive = match && (
          match.status === "live" ||
          match.status === "halftime" ||
          match.period === "FirstHalf" ||
          match.period === "SecondHalf" ||
          match.period === "HalfTime"
        );

        if (!isLive && !isToday) return;

        const fixtureId = match ? (match.efl_id || "g2685176") : "";
        const plId = match ? match.pl_match_id : "";

        livePollInterval = setInterval(async () => {
          try {
            let scoreChanged = false;
            let shouldRefresh = false;

            if (isPl) {
              const res = await fetch(`/api/pl-match?matchId=${plId}&_t=${Date.now()}`);
              if (res.ok) {
                const json = await res.json();
                if (json.success) {
                  const oldScore = `${match.home_score}-${match.away_score}`;
                  const newScore = `${json.score?.home}-${json.score?.away}`;
                  if (oldScore !== newScore) scoreChanged = true;
                  applyPlLiveData(match, json);
                  shouldRefresh = true;
                }
              }
            } else if (isEfl) {
              const res = await fetch(`/api/efl-match?fixtureId=${fixtureId}&_t=${Date.now()}`);
              if (res.ok) {
                const json = await res.json();
                if (json.success && json.data) {
                  const live = json.data;
                  const oldScore = `${match.home_score}-${match.away_score}`;
                  const newScore = `${live.home_score}-${live.away_score}`;
                  if (oldScore !== newScore) scoreChanged = true;
                  applyEflLiveData(match, live);
                  shouldRefresh = true;
                }
              }
            }

            // Sync from Football-Data for Men matches
            if (isMen) {
              try {
                const fdRes = await fetch(`/api/football-data/teams/61/matches?_t=${Date.now()}`);
                if (fdRes.ok) {
                  const fdJson = await fdRes.json();
                  if (fdJson && Array.isArray(fdJson.matches)) {
                    window.footballDataMatches = fdJson.matches;
                    const matchedFd = findFootballDataMatch(fdJson.matches, match, match.id);
                    if (matchedFd) {
                      const oldScore = `${match.home_score}-${match.away_score}`;
                      const changed = applyFootballDataLive(match, matchedFd);
                      const newScore = `${match.home_score}-${match.away_score}`;
                      if (oldScore !== newScore) scoreChanged = true;
                      if (changed) shouldRefresh = true;
                    }
                  }
                }
              } catch (e) {}
            }

            // Update Scoreboard Header
            const scoreMainEl = document.getElementById("scoreMain");
            if (scoreMainEl) {
              const sHome = match.home_score != null ? match.home_score : "-";
              const sAway = match.away_score != null ? match.away_score : "-";
              if (match.status === "upcoming" || (sHome === "-" && sAway === "-")) {
                const localDT = window.getLocalMatchDateTime
                  ? window.getLocalMatchDateTime(match.date, match.time_th || match.time, match.time_uk)
                  : { time: match.time || "TBC" };
                const tStr = localDT.time !== "TBC" ? localDT.time + " น." : "TBC";
                scoreMainEl.innerHTML = `
                  <span class="kickoff-label-tag">
                    <svg class="component-icon" width="20" height="20" role="img"><use xlink:href="/img/match-page/icons.svg?v=1.1501.0#KICK_OFF_DARK"></use></svg>
                    <span>เวลาเริ่ม Kick-off</span>
                  </span>
                  <span class="kickoff-time-text">${tStr}</span>
                `;
              } else {
                scoreMainEl.textContent = `${sHome} - ${sAway}`;
              }
            }

            const liveBadgeWrapEl = document.getElementById("liveBadgeWrap");
            if (liveBadgeWrapEl) {
              if (match.status === "live") {
                const liveText = match.clock || match.time_live || "LIVE";
                liveBadgeWrapEl.innerHTML = `<div class="match-status live"><span class="live-dot"></span> ${liveText}</div>`;
              } else if (match.status === "halftime" || match.period === "HalfTime") {
                liveBadgeWrapEl.innerHTML = `<div class="match-status live" style="background: #e65100; color: #fff;"><span class="live-dot"></span> HT</div>`;
              } else if (match.status === "completed" || match.period === "FullTime") {
                liveBadgeWrapEl.innerHTML = `<div class="match-status">FULL TIME</div>`;
              }
            }

            // Update Timestamp
            const timeEl = document.getElementById("liveSyncTimestamp");
            if (timeEl) {
              timeEl.textContent = `อัปเดตล่าสุด: ${new Date().toLocaleTimeString("th-TH")}`;
            }

            if (scoreChanged || shouldRefresh) {
              const container = document.getElementById("matchContent");
              if (container) {
                const activeBtn = document.querySelector(".tab-btn.active");
                const activeTarget = activeBtn ? activeBtn.getAttribute("data-target") : null;
                renderMatchDetail(match, container);
                if (activeTarget) {
                  const newBtn = document.querySelector(
                    `.tab-btn[data-target="${activeTarget}"]`
                  );
                  if (newBtn) newBtn.click();
                }
              }
            }
          } catch (err) {
            console.warn("Real-time sync error:", err);
          }
        }, 15000);
      }
