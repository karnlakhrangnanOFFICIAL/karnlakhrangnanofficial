<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Top Loop & Stem -->
  <circle cx="256" cy="68" r="40" fill="none" stroke="#ffffff" stroke-width="18" />
  <rect x="247" y="106" width="18" height="38" fill="#ffffff" />

  <!-- Side Buttons -->
  <rect x="132" y="146" width="30" height="18" rx="4" transform="rotate(-35 147 155)" fill="#ffffff" />
  <rect x="350" y="146" width="30" height="18" rx="4" transform="rotate(35 365 155)" fill="#ffffff" />

  <!-- Outer Stopwatch Body (White Ring) -->
  <circle cx="256" cy="316" r="160" fill="#000000" stroke="#ffffff" stroke-width="16" />

  <!-- Blue Sectors Ring (12 Sectors) -->
  <circle cx="256" cy="316" r="136" fill="#0033ff" />
  <circle cx="256" cy="316" r="62" fill="#000000" />

  <!-- 12 Black Sector Divider Spokes -->
  <g stroke="#000000" stroke-width="12" stroke-linecap="square">
    <line x1="256" y1="180" x2="256" y2="254" />
    <line x1="256" y1="378" x2="256" y2="452" />
    <line x1="120" y1="316" x2="194" y2="316" />
    <line x1="318" y1="316" x2="392" y2="316" />

    <!-- 30 deg -->
    <line x1="324" y1="198" x2="287" y2="262" />
    <line x1="188" y1="434" x2="225" y2="370" />

    <!-- 60 deg -->
    <line x1="374" y1="248" x2="310" y2="285" />
    <line x1="138" y1="384" x2="202" y2="347" />

    <!-- 120 deg -->
    <line x1="374" y1="384" x2="310" y2="347" />
    <line x1="138" y1="248" x2="202" y2="285" />

    <!-- 150 deg -->
    <line x1="324" y1="434" x2="287" y2="370" />
    <line x1="188" y1="198" x2="225" y2="262" />
  </g>

  <!-- Center Black Outline Ring for Yellow Circle -->
  <circle cx="256" cy="316" r="66" fill="#000000" />

  <!-- Center Yellow Face -->
  <circle cx="256" cy="316" r="60" fill="#ffdd00" />

  <!-- Face Elements -->
  <!-- Left Eye: Black circle with yellow center -->
  <circle cx="230" cy="300" r="19" fill="#000000" />
  <circle cx="230" cy="300" r="5.5" fill="#ffdd00" />

  <!-- Right Eye: Tilted black spot -->
  <ellipse cx="295" cy="290" rx="8.5" ry="7" transform="rotate(-20 295 290)" fill="#000000" />

  <!-- Bottom Left Beauty Spot -->
  <circle cx="245" cy="360" r="8" fill="#000000" />

  <!-- Slanted Mouth Line -->
  <path d="M 270 367 L 302 334" stroke="#000000" stroke-width="15" stroke-linecap="round" fill="none" />
</svg>
