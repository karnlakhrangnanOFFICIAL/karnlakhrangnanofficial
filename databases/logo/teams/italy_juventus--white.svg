    <!-- แถบตัว J ด้านซ้าย -->
    <path d="M 60,0 
             H 0 
             V 25 
             H 35 
             V 100 
             C 35,125 20,140 -5,150 
             L 5,170 
             C 40,155 60,135 60,100 
             V 0 Z" />
    
    <!-- แถบตัว J ด้านขวา -->
    <path d="M 75,0 
             H 110 
             V 100 
             C 110,145 85,175 45,195 
             L 35,175 
             C 70,155 75,135 75,100 
             V 0 Z" />
             
  </g>
</svg>
