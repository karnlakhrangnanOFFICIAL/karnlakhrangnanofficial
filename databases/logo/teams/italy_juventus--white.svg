<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 160 250" width="100%" height="100%">
  
  <!-- กลุ่มของตัว J ตั้งค่าให้ตัวด้านในสีดำ ขอบสีขาว -->
