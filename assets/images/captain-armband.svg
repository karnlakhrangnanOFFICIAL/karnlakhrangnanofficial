<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <!-- คำจำกัดความสีและรูปแบบ -->
  <defs>
    <style>
      .navy { fill: #0d1b3e; }
      .gold { fill: #d4af37; }
      .white { fill: #ffffff; }
      .gold-stroke { stroke: #d4af37; stroke-width: 4; fill: none; }
      .gold-stroke-thick { stroke: #d4af37; stroke-width: 8; fill: none; }
      .text-style { font-family: 'Arial', sans-serif; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .thai-text { font-family: 'Tahoma', 'Arial Unicode MS', sans-serif; font-weight: bold; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>

  <!-- พื้นหลังปลอกแขน -->
  <rect x="50" y="100" width="900" height="300" rx="20" ry="20" class="navy" />
  
  <!-- แถบสีขาวแนวนอน -->
  <rect x="50" y="180" width="900" height="60" class="white" />
  <rect x="50" y="280" width="900" height="60" class="white" />

  <!-- แถบสีทองด้านขวา -->
  <rect x="600" y="220" width="350" height="12" class="gold" />
  <rect x="600" y="245" width="350" height="12" class="gold" />
  <rect x="600" y="270" width="350" height="12" class="gold" />
  <rect x="600" y="295" width="350" height="12" class="gold" />

  <!-- เส้นด้ายเย็บขอบบนและล่าง -->
  <line x1="70" y1="115" x2="930" y2="115" class="gold-stroke" stroke-dasharray="10 10" stroke-width="3" />
  <line x1="70" y1="385" x2="930" y2="385" class="gold-stroke" stroke-dasharray="10 10" stroke-width="3" />
  
  <!-- เส้นขอบนอกสุด -->
  <rect x="50" y="100" width="900" height="300" rx="20" ry="20" fill="none" stroke="#d4af37" stroke-width="4" />

  <!-- โล่ตรงกลาง (Shield) -->
  <path d="M 500 120 L 620 120 L 620 250 L 560 310 L 500 350 L 440 310 L 380 250 L 380 120 Z" class="navy" stroke="#d4af37" stroke-width="8" stroke-linejoin="round"/>
  <!-- ขอบในของโล่ -->
  <path d="M 500 135 L 600 135 L 600 245 L 550 295 L 500 330 L 450 295 L 400 245 L 400 135 Z" fill="none" stroke="#d4af37" stroke-width="4" stroke-linejoin="round"/>

  <!-- ตัวอักษร C ตรงกลาง -->
  <path d="M 540 180 C 480 180 460 210 460 240 C 460 270 480 300 540 300 L 540 270 C 505 270 495 260 495 240 C 495 220 505 210 540 210 Z" class="gold" />

  <!-- วงกลมพื้นหลังโล่ -->
  <circle cx="500" cy="240" r="160" fill="none" stroke="#d4af37" stroke-width="10" />
  <circle cx="500" cy="240" r="150" class="navy" opacity="0.8" />

  <!-- ดาว 5 ดวงด้านบน -->
  <g class="gold">
    <polygon points="500,110 505,120 515,120 508,128 510,138 500,133 490,138 492,128 485,120 495,120" />
    <polygon points="450,120 455,130 465,130 458,138 460,148 450,143 440,148 442,138 435,130 445,130" />
    <polygon points="550,120 555,130 565,130 558,138 560,148 550,143 540,148 542,138 535,130 545,130" />
    <polygon points="410,145 415,155 425,155 418,163 420,173 410,168 400,173 402,163 395,155 405,155" />
    <polygon points="590,145 595,155 605,155 598,163 600,173 590,168 580,173 582,163 575,155 585,155" />
  </g>

  <!-- ใบมะกอก (Laurel Wreath) ซ้าย -->
  <g class="gold">
    <path d="M 380 200 Q 340 240 360 300 Q 370 270 380 250 Q 360 230 380 200 Z" />
    <path d="M 360 220 Q 320 250 340 300 Q 350 280 360 260 Q 340 240 360 220 Z" />
    <path d="M 390 280 Q 360 300 380 330 Q 390 310 400 300 Q 380 290 390 280 Z" />
  </g>

  <!-- ใบมะกอก (Laurel Wreath) ขวา -->
  <g class="gold">
    <path d="M 620 200 Q 660 240 640 300 Q 630 270 620 250 Q 640 230 620 200 Z" />
    <path d="M 640 220 Q 680 250 660 300 Q 650 280 640 260 Q 660 240 640 220 Z" />
    <path d="M 610 280 Q 640 300 620 330 Q 610 310 600 300 Q 620 290 610 280 Z" />
  </g>

  <!-- ข้อความ CAPTAIN -->
  <text x="500" y="410" font-size="46" class="text-style" letter-spacing="2">CAPTAIN</text>
  
  <!-- ข้อความตัว C -->
  <text x="500" y="455" font-size="34" class="thai-text">C</text>

</svg>
