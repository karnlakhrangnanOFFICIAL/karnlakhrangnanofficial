<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04172f" />
      <stop offset="40%" stop-color="#034694" />
      <stop offset="100%" stop-color="#0a2e5c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#f3e5ab" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1e88e5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#04172f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer background circle -->
  <circle cx="100" cy="100" r="98" fill="url(#blueGrad)" />
  <circle cx="100" cy="100" r="98" fill="url(#glow)" />
  
  <!-- Outer Gold Rings -->
  <circle cx="100" cy="100" r="93" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.85"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Stylized player silhouette -->
  <path d="M100 42 A 22 22 0 0 1 100 86 A 22 22 0 0 1 100 42 Z" fill="rgba(255,255,255,0.92)"/>
  <path d="M52 152 C52 118 72 100 100 100 C128 100 148 118 148 152 C134 165 118 172 100 172 C82 172 66 165 52 152 Z" fill="rgba(255,255,255,0.92)"/>
  
  <!-- Collar Accent -->
  <path d="M88 100 L100 115 L112 100 Z" fill="#034694"/>

  <!-- Initials Badge at bottom center -->
  <rect x="68" y="146" width="64" height="26" rx="13" fill="#04172f" stroke="url(#goldGrad)" stroke-width="2"/>
  <text x="100" y="164" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="900" fill="#f3e5ab" text-anchor="middle" letter-spacing="1">MD</text>
  
  <!-- Star accents -->
  <polygon points="100,16 103,24 111,24 105,29 107,37 100,32 93,37 95,29 89,24 97,24" fill="url(#goldGrad)"/>
</svg>